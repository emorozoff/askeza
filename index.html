<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="askeza">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>askeza</title>
<style>
/* ============================================================
   askeza 2 — дизайн-система
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0b0d;
  --surface:#17171a;
  --surface2:#232326;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#f5f5f7;
  --text2:#9a9aa0;
  --text3:#6e6e76;
  --accent:#2aabee;
  --red:#ff453a;
  --orange:#ff9f0a;
  --yellow:#ffd60a;
  --green:#30d158;
  --bronze:#cd7f32;--silver:#b6b6be;--gold:#ffd60a;--plat:#c4a7ff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.8,.26,1);
  --spring:cubic-bezier(.34,1.42,.64,1);
}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* Фоновое свечение цветом привычки. currentColor внутри градиента
   позволяет плавно перетекать между цветами одной transition. */
#glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  color:#2aabee;opacity:.20;
  background:radial-gradient(135% 52% at 50% -10%,currentColor 0%,transparent 72%);
  transition:color 1.4s var(--ease),opacity 1.4s var(--ease);
}
#app{position:relative;z-index:1;padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bottom) + 28px)}

/* ---------------- анимации ---------------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.stagger>*{animation:fadeUp .5s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}
.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}
.stagger>*:nth-child(8){animation-delay:.37s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #glow{transition:none}
}

/* ---------------- топбар ---------------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;animation:fadeIn .4s ease}
.brand{display:flex;align-items:baseline;gap:7px}
.brand h1{font-size:23px;font-weight:800;letter-spacing:-.4px;color:#fff}
.brand .ver{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.4px}
.tb-actions{display:flex;gap:2px}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;
  color:var(--text2);border-radius:50%;cursor:pointer;transition:background .2s,transform .15s,color .2s}
.icon-btn:active{background:var(--surface2);transform:scale(.9)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------------- шапка привычки ---------------- */
.h-head{text-align:center;padding:2px 24px 0}
.h-ico{font-size:38px;line-height:1.2;margin-bottom:8px}
.h-name{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.15;color:#fff;word-break:break-word}
.h-since{font-size:12.5px;color:var(--text3);margin-top:5px;font-weight:450}

/* ---------------- герой: число дней ---------------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:22px 20px 14px}
.hero-big{font-size:72px;font-weight:800;letter-spacing:-3.4px;line-height:.96;color:#fff}
.hero-unit{font-size:15px;font-weight:600;color:var(--text2);margin-top:8px;letter-spacing:.2px}

/* ---------------- карточки ---------------- */
.card{margin:0 12px 10px;background:var(--surface);border-radius:20px;border:1px solid var(--line);
  cursor:pointer;transition:transform .16s var(--ease),background .2s}
.card:active{transform:scale(.982);background:var(--surface2)}
.chev{color:var(--text3);flex-shrink:0;width:8px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* карточка тяги */
.craving{padding:14px 16px}
.craving-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.craving-label{font-size:10.5px;font-weight:700;color:var(--text3);letter-spacing:1.1px;text-transform:uppercase}
.craving-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.craving-num{display:flex;align-items:baseline;line-height:1}
.cv-int{font-size:38px;font-weight:800;letter-spacing:-1.6px}
.cv-dot{font-size:30px;font-weight:800}
.cv-dec{font-size:19px;font-weight:650;opacity:.62}
.cv-pct{font-size:17px;font-weight:650;opacity:.42;margin-left:3px}
.zone{font-size:11px;font-weight:700;padding:5px 11px;border-radius:9px;white-space:nowrap;letter-spacing:.1px}

/* одометр */
.odo{padding:0 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px}
/* Подложка полос светлее остальных поверхностей приложения: так было в
   askeza 1, откуда взята палитра, и без неё цвета читаются иначе. */
.obar{position:relative;height:41px;background:#2c2c2e;border-radius:14px;overflow:hidden}
.obar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:14px}
/* Затемнения слева нет: оно съедало цвет заливки. Белый текст держится на
   тени — так же, как в askeza 1, откуда взята вся палитра полос. */
.obar-txt{position:absolute;inset:0;z-index:2;display:flex;align-items:center;gap:7px;padding-left:17px;
  pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.obar-n{font-size:22px;font-weight:750;color:#fff;letter-spacing:-.4px}
.obar-l{font-size:13.5px;font-weight:550;color:rgba(255,255,255,.82)}

/* срывы: когда оборвалась каждая серия и сколько она держалась.
   Ряд устроен как карточка в списке привычек — плашка поверх кнопки,
   свайп влево уводит плашку и открывает удаление. */
.rel{margin:0 12px 10px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;overflow:hidden}
.rel-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 15px 8px}
.rel-label{font-size:10.5px;font-weight:700;color:var(--text3);letter-spacing:1.1px;text-transform:uppercase}
.rel-row{position:relative}
.rel-acts{position:absolute;top:0;right:0;bottom:0;z-index:0;display:flex}
.rel-act{width:92px;border:none;background:var(--surface2);color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10.5px;font-weight:600;font-family:inherit;transition:filter .15s}
.rel-act:active{filter:brightness(1.3)}
.rel-act.del{background:var(--red)}
.rel-act svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rel-card{position:relative;z-index:1;background:var(--surface);padding:15px;
  touch-action:pan-y;transition:transform .34s var(--ease)}
.rel-card.raw{transition:none}
.rel-row+.rel-row .rel-card{box-shadow:0 -1px 0 var(--line)}
/* Содержимое строки не гаснет при свайпе, в отличие от карточки привычки:
   там под кнопки уезжала полоса прогресса, а тут — дата, и её нужно видеть,
   чтобы понимать, какой именно срыв удаляешь. */
.rel-in{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rel-when{font-size:13.5px;font-weight:550;color:var(--text2);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-when em{font-style:normal;font-size:10px;font-weight:700;color:var(--text3);
  letter-spacing:.5px;text-transform:uppercase;margin-left:7px}
.rel-len{font-size:14.5px;font-weight:750;color:#fff;white-space:nowrap;letter-spacing:-.2px}
.rel-more{display:block;width:calc(100% - 24px);margin:10px 12px 12px;padding:9px;border:none;
  border-radius:12px;background:var(--surface2);color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:opacity .2s}
.rel-more:active{opacity:.6}

/* режим: отметка дня, календарь, статистика */
.checkin{margin:0 16px 10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.ci-btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:16.5px;font-weight:700;cursor:pointer;
  color:#fff;transition:transform .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:9px}
.ci-btn:active{transform:scale(.978);opacity:.88}
.ci-done{display:flex;align-items:center;gap:12px}
.ci-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0}
.ci-t{font-size:15.5px;font-weight:700}
.ci-s{font-size:12.5px;color:var(--text3);margin-top:2px}
.ci-edit{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;padding:8px;cursor:pointer}
.ask{margin:0 16px 10px;padding:14px 16px;background:rgba(255,159,10,.09);border:1px solid rgba(255,159,10,.3);border-radius:18px}
.ask-t{font-size:14.5px;font-weight:650;margin-bottom:3px}
.ask-s{font-size:12.5px;color:var(--text3);margin-bottom:11px}
.ask-b{display:flex;gap:8px}
.ask-b button{flex:1;padding:12px;border:none;border-radius:13px;font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .15s}
.ask-b button:active{transform:scale(.95)}
.ask-yes{background:rgba(48,209,88,.18);color:#4ade80}
.ask-no{background:rgba(255,69,58,.16);color:#ff6a60}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px}
.cal-h{padding-bottom:6px}
.cal-h span{text-align:center;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.3px}
.cal{margin-bottom:12px}
.cal-d{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;color:var(--text3);background:rgba(255,255,255,.045);
  transition:transform .2s var(--spring)}
.cal-d.ok{background:#30d158;color:#052e12;font-weight:750}
.cal-d.miss{background:rgba(255,69,58,.2);color:#ff6a60}
.cal-d.out{opacity:.2}
.cal-d.today{box-shadow:0 0 0 2px var(--accent)}
.dstat{display:flex;gap:8px;padding:0 16px 10px}

/* цитата */
.quote{margin:6px 30px 0;text-align:center;font-size:13px;color:var(--text2);line-height:1.62;
  cursor:pointer;user-select:none;font-weight:450}
.quote span{display:inline-block;transition:opacity .22s,transform .22s}
.quote:active{opacity:.55}

/* пустой экран */
.empty{text-align:center;padding:72px 34px;animation:fadeUp .5s var(--ease)}
.empty-ico{font-size:52px;margin-bottom:18px}
.empty h2{font-size:20px;font-weight:750;margin-bottom:9px}
.empty p{font-size:14px;color:var(--text2);line-height:1.55;margin-bottom:26px}

.btn{display:block;width:100%;padding:15px;border:none;border-radius:16px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .2s;letter-spacing:.1px}
.btn:active{transform:scale(.978);opacity:.88}
.btn:disabled{opacity:.32;pointer-events:none}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.inline{width:auto;padding:14px 32px;display:inline-block}
.btn.danger{background:rgba(255,69,58,.14);color:var(--red)}

/* ---------------- список привычек: корневой экран ---------------- */
#app[data-view="list"] #home{display:none}
#app[data-view="habit"] #list{display:none}
@keyframes viewBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.view-back{animation:viewBack .28s var(--ease) both}

.list{padding:6px 14px 0}
/* Ряд = карточка поверх кнопок. Кнопки лежат под карточкой у правого края
   и открываются, когда карточка уезжает влево. */
.hrow{position:relative;margin-bottom:10px}
.hrow.lift{z-index:5}
.hrow-acts{position:absolute;top:0;right:0;bottom:0;z-index:0;display:flex;gap:9px;padding-left:10px}
.hact{width:120px;border:none;border-radius:20px;background:var(--surface2);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s,transform .15s}
.hact:active{filter:brightness(1.3);transform:scale(.95)}
.hact.del{background:var(--red)}
.hact svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.hcard{position:relative;z-index:1;background:var(--surface);border-radius:18px;
  padding:13px 16px 9px 18px;overflow:hidden;cursor:pointer;
  touch-action:pan-y;transition:transform .34s var(--ease),box-shadow .22s,background .15s}
.hcard.raw{transition:box-shadow .22s,background .15s}
/* Уезжая под кнопки, карточка гасит содержимое: обрезок полосы у края
   выглядел бы мусором, а пустая плашка — намеренным состоянием. */
.hcard-in{opacity:var(--fade,1);transition:opacity .3s var(--ease)}
.hcard.raw .hcard-in{transition:none}
.hrow.lift .hcard{background:#1e1e22;box-shadow:0 14px 34px rgba(0,0,0,.55)}
/* Левый край карточки в цвете привычки. Лежит внутри неё, поэтому уезжает
   вместе с ней при свайпе, а скругление берёт от overflow:hidden карточки. */
.hstripe{position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2;pointer-events:none}
/* Обрезку сверху давал overflow:hidden на всей строке: глиф эмодзи выше строки
   текста. Прячем переполнение только у названия, эмодзи даём дышать. */
.hname{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--text);
  white-space:nowrap}
.hname-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.hico{flex:0 0 auto;font-size:16px;line-height:1.35}
.hdays{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2;color:#fff;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Восемь ступеней до года. Деления одинаковой ширины, хотя стоят за разный
   срок: первые дни самые трудные и должны давать самое заметное движение. */
.hbar{display:flex;gap:3.5px;margin-top:11px}
/* Подпись текущей ступени. Своя строка фиксированной высоты, чтобы карточки
   с пройденным годом не оказались ниже остальных. */
.hstep{position:relative;height:13px;margin-top:5px}
.hstep i{position:absolute;top:0;font-style:normal;font-size:9.5px;color:var(--text3);
  letter-spacing:.2px;white-space:nowrap;transform:translateX(-50%)}
.hseg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden}
.hseg i{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease)}

.icon-btn.plus{width:46px;height:46px;background:var(--surface);color:#fff;border-radius:15px}
.icon-btn.plus:active{background:var(--surface2);transform:scale(.92)}
.icon-btn.plus svg{width:25px;height:25px;stroke-width:2.3}

/* ---------------- нижний шит ---------------- */
.sheet-bd{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s;
  display:flex;align-items:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-bd.on{opacity:1;pointer-events:auto}
.sheet{width:100%;background:#1c1c1f;border-radius:22px 22px 0 0;padding:0 14px calc(var(--safe-bottom) + 14px);
  transform:translateY(100%);transition:transform .34s var(--ease);border-top:1px solid var(--line2)}
.sheet-bd.on .sheet{transform:none}
.sheet-grip{width:38px;height:4.5px;background:rgba(255,255,255,.18);border-radius:3px;margin:10px auto 6px}
.sheet-title{text-align:center;font-size:13px;color:var(--text3);padding:6px 20px 12px;line-height:1.5}
.s-item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 8px;border:none;background:none;
  font-size:16.5px;color:var(--text);cursor:pointer;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);transition:opacity .15s}
.s-item:last-of-type{border-bottom:none}
.s-item:active{opacity:.5}
.s-item.danger{color:var(--red)}
.s-item.warn{color:var(--orange)}
.s-ico{width:26px;text-align:center;font-size:19px;flex-shrink:0}
.s-cancel{width:100%;padding:15px;background:var(--surface2);border:none;border-radius:15px;
  font-size:16.5px;font-weight:650;color:var(--text);cursor:pointer;margin-top:10px;transition:opacity .15s}
.s-cancel:active{opacity:.6}

/* ---------------- полноэкранные страницы ---------------- */
/* Экраны стоят горизонтальной стопкой: список → привычка → страница.
   Так открытие совпадает с жестом «назад» от левого края. */
.page{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .34s var(--ease);visibility:hidden;
  box-shadow:-16px 0 38px rgba(0,0,0,.5);padding-top:var(--safe-top)}
.page.on{transform:none;visibility:visible}
@keyframes slideFromRight{from{transform:translateX(100%)}to{transform:none}}
.slide-in{animation:slideFromRight .3s var(--ease) both}
/* Пока тянут экран, список лежит под ним и выезжает из-под левого края. */
#app.navigating[data-view="habit"] #list{display:block;position:absolute;left:0;right:0;z-index:0}
#app.navigating #home{position:relative;z-index:1;background:var(--bg);min-height:100vh;
  box-shadow:-16px 0 38px rgba(0,0,0,.5)}
.page-bar{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;flex-shrink:0}
.page-title{font-size:17px;font-weight:750;flex:1;text-align:center;padding-right:40px}
.page-title.left{text-align:left;padding-right:0;padding-left:4px}
.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 26px)}
.page-foot{flex-shrink:0;padding:10px 16px calc(var(--safe-bottom) + 12px);background:linear-gradient(to top,var(--bg) 62%,transparent)}
.back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;
  color:var(--accent);cursor:pointer;border-radius:50%;transition:background .2s,transform .15s;flex-shrink:0}
.back-btn:active{background:var(--surface2);transform:scale(.9)}
.back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page-sub{font-size:13px;color:var(--text3);text-align:center;padding:0 20px 14px}
.sec-h{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;padding:16px 20px 8px}

/* ---------------- график ---------------- */
.ch-live{padding:2px 20px 6px}
.ch-lab{font-size:11px;font-weight:650;color:var(--text3);letter-spacing:.9px;text-transform:uppercase;display:block;margin-bottom:3px}
.ch-num{display:flex;align-items:baseline;line-height:1}
.ch-int{font-size:44px;font-weight:800;letter-spacing:-2px}
.ch-dot{font-size:38px;font-weight:800}
.ch-dec{font-size:25px;font-weight:700;opacity:.65}
.ch-pct{font-size:21px;font-weight:650;opacity:.4;margin-left:4px}

/* ============================================================
   askeza 2.0
   Приложение для отказа от привычек. Один файл, без зависимостей.
   ============================================================ */

const VERSION='3.9';

const KEY_BACKUP='askeza2_backup';
const KEY_V1='askeza_data';       // старое приложение — только чтение, никогда не пишем

/* ------------------------------------------------------------
   Утилиты
   ------------------------------------------------------------ */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-t,3);

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** Русская плюрализация: plural(21,'день','дня','дней') -> 'день' */
function plural(n,one,few,many){
  const a=Math.abs(Math.floor(n)),d=a%10,h=a%100;
  if(d===1&&h!==11)return one;
  if(d>=2&&d<=4&&(h<12||h>14))return few;
  return many;
}
const nDays=n=>n+' '+plural(n,'день','дня','дней');

/** Локальная дата в формате YYYY-MM-DD. Никогда не через toISOString —
    он возвращает UTC и сдвигает дату у всех восточнее Гринвича. */
const localDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const localTime=d=>pad(d.getHours())+':'+pad(d.getMinutes());

const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtDate(x){const d=new Date(x);return d.getDate()+' '+MONTHS_SHORT[d.getMonth()]+' '+d.getFullYear()}
function fmtDateTime(x){const d=new Date(x);return fmtDate(d)+', '+localTime(d)}
function fmtLong(x){const d=new Date(x);return d.getDate()+' '+MONTHS[d.getMonth()]}

/** Календарная разбивка с заимствованием — настоящие месяцы, а не «30 дней». */
function breakdown(from,to){
  const a=new Date(from),b=new Date(to);
  let s=b.getSeconds()-a.getSeconds(), mi=b.getMinutes()-a.getMinutes(), h=b.getHours()-a.getHours();
  let d=b.getDate()-a.getDate(), mo=b.getMonth()-a.getMonth(), y=b.getFullYear()-a.getFullYear();
  if(s<0){s+=60;mi--}
  if(mi<0){mi+=60;h--}
  if(h<0){h+=24;d--}
  if(d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();mo--}
  if(mo<0){mo+=12;y--}
  return {y,mo,d,h,mi,s};
}
const daysInMonthBefore=t=>{const b=new Date(t);return new Date(b.getFullYear(),b.getMonth(),0).getDate()};

function fmtLeft(sec){
  if(sec<=0)return'—';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);
  if(d>0)return d+' '+plural(d,'день','дня','дней')+' '+pad(h)+':'+pad(m)+':'+pad(s);
  return pad(h)+':'+pad(m)+':'+pad(s);
}
function fmtRough(sec){
  if(sec<60)return'меньше минуты';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d>=365){const y=Math.floor(d/365),r=Math.floor((d%365)/30);return y+' '+plural(y,'год','года','лет')+(r?' '+r+' мес':'')}
  if(d>=60){const mo=Math.floor(d/30);return mo+' '+plural(mo,'месяц','месяца','месяцев')}
  if(d>0)return nDays(d)+(h?' '+h+' '+plural(h,'час','часа','часов'):'');
  if(h>0)return h+' '+plural(h,'час','часа','часов');
  return m+' '+plural(m,'минута','минуты','минут');
}

/* ------------------------------------------------------------

const KINDS={
  smoking:{title:'Курение',   color:'#ff453a'},

   abstain — непрерывный отсчёт с момента отказа, обрывается срывом;
   daily   — серия дней, каждый день нужно закрыть отметкой.

/* Сила тяги в % от пика по дням воздержания. Это опорные точки из исследований,
   а не подогнанная формула: кривая обязана проходить через них. */
const CRAVING={
  smoking:[[0,100],[1,97],[3,92],[7,72],[14,48],[30,30],[90,18],[180,12],[365,8],[730,6],[1825,4],[3650,3]],
  alcohol:[[0,100],[3,97],[7,88],[14,76],[30,62],[90,42],[180,30],[365,20],[730,12],[1825,4],[3650,3]],
  weed:   [[0,100],[3,100],[7,85],[14,63],[30,43],[90,27],[180,17],[365,10],[730,6],[1825,3],[3650,2]],
};

/* Монотонная кубическая интерполяция (PCHIP) в лог-пространстве дней:
   проходит через точки, гладкая, никогда не растёт обратно. */
function buildCurve(anchors){
  const xs=anchors.map(a=>Math.log10(1+a[0])),ys=anchors.map(a=>a[1]),n=xs.length,h=[],d=[];
  for(let i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(ys[i+1]-ys[i])/h[i]}
  const m=new Array(n);m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0)m[i]=0;
    else{const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}
  }
  return function(sec){
    const x=Math.log10(1+Math.max(0,sec/86400));
    if(x<=xs[0])return ys[0];
    if(x>=xs[n-1])return ys[n-1];
    let i=0;while(i<n-1&&x>xs[i+1])i++;
    const t=(x-xs[i])/h[i],t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h[i]*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h[i]*m[i+1];
  };
}
const CURVES={smoking:buildCurve(CRAVING.smoking),alcohol:buildCurve(CRAVING.alcohol),weed:buildCurve(CRAVING.weed)};
const hasCurve=k=>!!CURVES[k];
const craving=(k,sec)=>CURVES[k]?CURVES[k](sec):0;

/** Знаков после запятой — по фактической скорости изменения кривой. */
function cravingDigits(k,sec){
  const f=CURVES[k];if(!f)return 2;
  const spd=Math.abs(f(sec+0.5)-f(sec-0.5))*0.1;
  if(spd<=0)return 8;
  return clamp(Math.ceil(-Math.log10(spd))+1,2,8);
}

let S={v:2,habits:[],activeId:null,quoteIdx:0};

function blank(){return{v:2,habits:[],activeId:null,quoteIdx:Math.floor(Math.random()*QUOTES.length)}}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.habits))return normalize(d)}
  }catch(e){console.warn('основное хранилище не прочиталось',e)}

    const raw=localStorage.getItem(KEY_BACKUP);
    if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.habits)){toast('Данные восстановлены из копии');return normalize(d)}}
  }catch(e){}
  return blank();
}
function normalize(d){
  d.v=2;
  d.quoteIdx=d.quoteIdx||0;
  d.habits=(d.habits||[]).filter(h=>h&&h.id).map(h=>({
    id:h.id,
    name:String(h.name||'Привычка'),
    kind:KINDS[h.kind]?h.kind:'custom',
    color:h.color||'#2aabee',
    emoji:h.emoji||LEGACY_ICON[h.icon]||undefined,   // icon — ключ значка из v3.0–v3.1
    startedAt:h.startedAt||new Date().toISOString(),
    history:Array.isArray(h.history)?h.history:[],
    sid:h.sid||1,
    daily:(KINDS[h.kind]&&KINDS[h.kind].mode==='daily')
      ? {wakeBy:(h.daily&&h.daily.wakeBy)||'07:00',checks:(h.daily&&h.daily.checks)||{}}
      : undefined,
  }));
  if(!d.habits.find(h=>h.id===d.activeId))d.activeId=d.habits.length?d.habits[0].id:null;
  return d;
}

function guessKind(name){

  if(/курен|сигарет|табак|никотин|вейп|куриц/.test(n))return'smoking';
  if(/алкогол|выпив|пить|бухл|спиртн|пиво|вино|водк/.test(n))return'alcohol';

  d.habits.forEach(h=>{

    const kind=guessKind(h.name);

/* ------------------------------------------------------------
   Выборки
   ------------------------------------------------------------ */
const active=()=>S.habits.find(h=>h.id===S.activeId)||null;
const elapsed=h=>Math.max(0,(Date.now()-new Date(h.startedAt).getTime())/1000);

/* --- режим: серия дней вместо непрерывного таймера --- */
const dayKey=d=>localDate(d);
const today=()=>dayKey(new Date());
function shiftDay(key,n){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
const checksOf=h=>(h&&h.daily&&h.daily.checks)||{};
const wakeBy=h=>(h&&h.daily&&h.daily.wakeBy)||'07:00';

/** Серия = дни подряд с отметкой «вовремя», считая назад от сегодня.
    Незакрытый сегодняшний день серию не обрывает — он ещё идёт. */
function streakInfo(h){
  const c=checksOf(h),t=today(),mark=c[t]||null;
  if(mark&&!mark.ok)return{days:0,startDay:null,mark};
  let cur=mark?t:shiftDay(t,-1),days=0,startDay=null;
  while(c[cur]&&c[cur].ok){days++;startDay=cur;cur=shiftDay(cur,-1)}
  return{days,startDay,mark};
}
/** Незакрытые прошедшие дни, которые ещё можно отметить задним числом. */
function openDays(h,back){
  const c=checksOf(h),out=[],from=dayKey(new Date(h.startedAt));
  for(let i=1;i<=(back||3);i++){
    const k=shiftDay(today(),-i);
    if(k<from)break;
    if(!c[k])out.push(k);
  }
  return out;
}
const streakDays=h=>isDaily(h)?streakInfo(h).days:Math.floor(elapsed(h)/D);

/** Все срывы привычки, новые сверху. Длину серии берём из записи, а если её
    там нет (данные ранних версий) — считаем от предыдущего старта.
    Это единственное место, где журнал `history` кто-то читает. */
function relapses(h){
  const hist=(h&&Array.isArray(h.history))?h.history:[];
  const out=[];let from=null;
  for(const e of hist){
    if(!e||!e.at)continue;
    if(e.t==='start'){from=e.at;continue}
    if(e.t!=='relapse')continue;
    const d=Number.isFinite(e.streakDays)?e.streakDays
      :from?Math.max(0,Math.floor((new Date(e.at)-new Date(from))/(D*1000))):0;
    out.push({at:e.at,days:d});
    from=e.at;
  }
  return out.reverse();
}

/** Позиция срыва в журнале по его номеру в списке (новые сверху). */
function relPos(h,idx){
  const hist=(h&&Array.isArray(h.history))?h.history:[];
  const pos=[];hist.forEach((e,i)=>{if(e&&e.t==='relapse')pos.push(i)});
  const i=pos[pos.length-1-idx];
  return i===undefined?-1:i;
}
/** Начало серии, которая шла до этого срыва. */
function relFrom(h,idx){
  const hist=(h&&h.history)||[],i=relPos(h,idx);
  if(i<0)return null;
  for(let k=i-1;k>=0;k--)if(hist[k]&&hist[k].t==='start')return hist[k].at;
  return null;
}
/** Сколько дней будет в серии, если убрать этот срыв: соседние сливаются. */
function relMerged(h,idx){
  const from=relFrom(h,idx);if(!from)return 0;
  const hist=h.history,i=relPos(h,idx);
  let to=Date.now();
  for(let k=i+1;k<hist.length;k++)if(hist[k].t==='relapse'){to=new Date(hist[k].at).getTime();break}
  return Math.max(0,Math.floor((to-new Date(from).getTime())/(D*1000)));
}
/** Убрать срыв: он не был, значит серии до и после него — одна серия.
    Вместе с записью уходит следующий за ней старт, а длина следующей серии
    (или текущей, если убрали последний срыв) считается заново. */
function dropRelapse(h,idx){
  const hist=(h&&Array.isArray(h.history))?h.history:null;
  const i=hist?relPos(h,idx):-1;
  if(i<0)return false;
  hist.splice(i,1);
  if(hist[i]&&hist[i].t==='start')hist.splice(i,1);
  let start=null;                          // старт серии, которая теперь тянется дальше
  for(let k=i-1;k>=0;k--)if(hist[k]&&hist[k].t==='start'){start=hist[k].at;break}
  let next=-1;
  for(let k=i;k<hist.length;k++)if(hist[k].t==='relapse'){next=k;break}
  if(start){
    if(next>=0)hist[next].streakDays=Math.max(0,
      Math.floor((new Date(hist[next].at)-new Date(start))/(D*1000)));
    else h.startedAt=start;                 // убрали последний срыв — серия тянется дальше
  }
  h.sid=Math.max(1,(h.sid||1)-1);
  return true;
}

function lastGrapheme(v){
  const t=String(v==null?'':v).replace(/\s+/g,'');
  if(!t)return'';
  try{
    const seg=[...new Intl.Segmenter('ru',{granularity:'grapheme'}).segment(t)];

  }catch(e){
    const a=Array.from(t);return a.length?a[a.length-1]:'';
  }
}

/* Полоса прогресса: восемь ступеней до года. Год считаем победой —
   дальше полоса полная и меняется только число дней. */
const SEG_STOPS=[0,1,3,7,14,30,90,180,365];
function segFills(h){
  const d=isDaily(h)?streakDays(h):elapsed(h)/D,out=[];
  for(let i=0;i<SEG_STOPS.length-1;i++)
    out.push(clamp((d-SEG_STOPS[i])/(SEG_STOPS[i+1]-SEG_STOPS[i]),0,1));
  return out;
}
/** Крупное число карточки: до года — дни, дальше «1 год 40 дней». */
function cardDays(h){
  const d=streakDays(h);
  if(d<365)return nDays(d);
  const y=Math.floor(d/365),r=d-y*365;
  return y+' '+plural(y,'год','года','лет')+(r?' '+nDays(r):'');
}
/* Едва начатое деление всё равно показываем полоской: отсчёт пошёл,
   и это должно быть видно с первой минуты. */
/* Подпись у деления, которое сейчас заполняется: не вся шкала, а ровно то,
   до чего идёшь. Считается по первому незаполненному делению. */
const SEG_LABELS=['1 день','3 дня','неделя','2 недели','месяц','3 месяца','полгода','год'];
const stepIndex=f=>f.findIndex(v=>v<1);          // -1 — год пройден, подписывать нечего
/* Центр k-го деления: восемь равных колонок и семь промежутков по 3.5px. */
const stepLeft=k=>`calc((100% - 24.5px) / 8 * ${k+.5} + 3.5px * ${k})`;
const stepHtml=k=>k<0?'':`<i style="left:${stepLeft(k)}">${SEG_LABELS[k]}</i>`;

const segStyle=(f,c)=>`width:${(f>0?Math.max(f,.045)*100:0).toFixed(1)}%;background:${c};opacity:${f>=1?1:.5}`;

function habitCard(h){

        <div class="hstep">${stepHtml(stepIndex(fills))}</div>
      </div>
    </div>
  </div>`;
}

/* ---------- архетип «отказ» ---------- */
function abstainHome(h){
  const sec=elapsed(h),b=breakdown(h.startedAt,Date.now());
  const has=hasCurve(h.kind);
  /* Палитра и лесенка прозрачности перенесены из askeza 1 без изменений:
     от насыщенного красного у лет до почти серого у секунд — крупные единицы
     весомее мелких, и это видно цветом, а не только длиной. */
  const units=[

    {k:'d', v:b.d, max:daysInMonthBefore(Date.now()),       l:['день','дня','дней'],         c:['#30a8e0','#1080c0'],op:.82},
    {k:'h', v:b.h, max:24,                                  l:['час','часа','часов'],        c:['#5050c8','#3535a0'],op:.65},
    {k:'mi',v:b.mi,max:60,                                  l:['минута','минуты','минут'],   c:['#7a6090','#5a4070'],op:.5},
    {k:'s', v:b.s, max:60,                                  l:['секунда','секунды','секунд'],c:['#a0a0a8','#787880'],op:.35},
  ].filter((u,i)=>u.v>0||i>=3);

  return `<div class="h-head">
      <div class="h-ico">${esc(emojiOf(h))}</div>
      <div class="h-name">${esc(h.name)}</div>

/* ---------- архетип «режим» ---------- */
function dailyHome(h){
  const col=habitColor(h),target=wakeBy(h);
  const st=streakInfo(h),mark=st.mark;

      <div><div class="ci-t">${ok?'Встал вовремя':'Проспал'}</div>

function fmtDayName(key){
  const t=today();
  if(key===shiftDay(t,-1))return'Вчера';
  if(key===shiftDay(t,-2))return'Позавчера';
  const d=new Date(key+'T12:00:00');
  return d.getDate()+' '+MONTHS_SHORT[d.getMonth()];
}
/** Пять недель, понедельник первым. */
function calendarCells(h){
  const c=checksOf(h),t=new Date();
  const monday=new Date(t);monday.setDate(t.getDate()-((t.getDay()+6)%7));
  const start=new Date(monday);start.setDate(monday.getDate()-28);
  const from=dayKey(new Date(h.startedAt)),tk=today(),out=[];
  for(let i=0;i<35;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=localDate(d);
    let st='out';
    if(k<=tk&&k>=from)st=c[k]?(c[k].ok?'ok':'miss'):'none';
    out.push({k,st,n:d.getDate(),isToday:k===tk});
  }
  return out;
}
function dailyStats(h){
  const c=checksOf(h),keys=Object.keys(c);
  const ok=keys.filter(k=>c[k].ok).length;
  const mins=keys.filter(k=>c[k].at).map(k=>{const[a,b]=c[k].at.split(':');return +a*60+ +b});
  const avg=mins.length?pad(Math.floor(mins.reduce((x,y)=>x+y,0)/mins.length/60))+':'+pad(Math.round(mins.reduce((x,y)=>x+y,0)/mins.length)%60):null;
  return{ok,miss:keys.length-ok,total:keys.length,avg};
}


let counting=false;
function countUp(node,target){
  if(!node||target<=0||prefersReduced())return;
  const dur=700,t0=performance.now();
  counting=true;
  (function step(t){
    const k=clamp((t-t0)/dur,0,1);
    node.textContent=Math.round(easeOut(k)*target);
    if(k<1)requestAnimationFrame(step);
    else{node.textContent=target;counting=false}
  })(t0);
}
/** Набор видимых полос одометра меняется, когда набегает новая единица
    (первый день, первый месяц). Тогда главный экран надо пересобрать. */
function shownKeysNow(h){
  const b=breakdown(h.startedAt,Date.now());
  const v=[b.y,b.mo,b.d,b.h,b.mi,b.s],k=['y','mo','d','h','mi','s'];
  return k.filter((_,i)=>v[i]>0||i>=3).join(',');
}
const prefersReduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setGlow(color){$('glow').style.color=color}

/* ------------------------------------------------------------
   Живое обновление
   ------------------------------------------------------------ */
function updateCraving(force){
  const h=active();if(!h||!R.cv||!hasCurve(h.kind))return;
  const sec=elapsed(h),v=craving(h.kind,sec),dig=cravingDigits(h.kind,sec);
  const str=v.toFixed(dig),i=str.indexOf('.');
  const z=zoneOf(v);
  if(force||R.last.cv!==str){
    R.last.cv=str;
    R.cv.innerHTML=`<span class="cv-int" style="color:${z.color}">${str.slice(0,i)}</span><span class="cv-dot" style="color:${z.color}">.</span><span class="cv-dec">${str.slice(i+1)}</span><span class="cv-pct">%</span>`;
  }
  if(force||R.last.zone!==z.label){
    R.last.zone=z.label;
    R.cvZone.textContent=z.label;
    R.cvZone.style.color=z.color;
    R.cvZone.style.background=zoneBg(z);
  }
}

function updateOdometer(force){
  const h=active();if(!h||!R.bars)return;
  const now=Date.now(),b=breakdown(h.startedAt,now);
  const vals={y:b.y,mo:b.mo,d:b.d,h:b.h,mi:b.mi,s:b.s};
  for(const k in R.bars){
    const r=R.bars[k],v=vals[k];
    if(v===undefined)continue;
    if(force||R.last['o'+k]!==v){
      R.last['o'+k]=v;
      r.n.textContent=v;
      r.l.textContent=plural(v,r.labels[0],r.labels[1],r.labels[2]);
      if(k!=='s')r.fill.style.width=clamp(v/r.max*100,0,100)+'%';
    }
  }
  // секундная полоса течёт непрерывно, а не прыгает раз в секунду
  const s=R.bars.s;
  if(s){
    const ms=(now-new Date(h.startedAt).getTime())/1000%60;
    s.fill.style.width=clamp(ms/60*100,0,100)+'%';
  }
}

function tickSecond(){
  if(view==='list'){updateList();return}
  const h=active();if(!h)return;
  if(R.daily){                                  // серия растёт отметками, а не секундами
    if(R.day&&R.day!==today()){renderHome(false);return}
    return;
  }
  if(R.shownKeys&&shownKeysNow(h)!==R.shownKeys){renderHome(false);return}
  updateOdometer(false);
  if(R.big&&!counting)R.big.textContent=Math.floor(elapsed(h)/D);
}

let lastSec=0,lastCv=0,running=true;
function loop(t){
  if(running){
    const now=Date.now();
    if(now-lastCv>=100){lastCv=now;updateCraving(false)}
    const sec=Math.floor(now/1000);
    if(sec!==lastSec){lastSec=sec;tickSecond()}
    else updateOdometer(false);
  }
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------
   Отметка дня (режим)
   ------------------------------------------------------------ */
function markDay(h,key,timeStr,forceOk){
  if(!h.daily)h.daily={wakeBy:'07:00',checks:{}};
  const ok=(forceOk===undefined)?(!!timeStr&&timeStr<=wakeBy(h)):!!forceOk;
  h.daily.checks[key]={ok,at:timeStr||null};
  // переотметка того же дня заменяет запись, а не плодит дубли
  h.history=h.history.filter(e=>!((e.t==='wake'||e.t==='oversleep')&&e.day===key));
  h.history.push({t:ok?'wake':'oversleep',at:new Date(key+'T'+(timeStr||'09:00')+':00').toISOString(),
                  day:key,time:timeStr||null});
  save();renderHome(true);
  const late=timeStr&&!ok?' в '+timeStr:'';
  toast(ok?(timeStr?'Засчитано, '+timeStr:'Засчитано'):'Записано'+late+'. Завтра новый шанс');
}

/* ------------------------------------------------------------
   Загрузка по ссылке
   Экрана импорта у приложения нет, а разложить привычки на новом устройстве
   или с самого начала иногда надо. Для этого ссылка вида
   .../askeza/#seed=<base64url JSON>: она несёт данные в себе, поэтому в коде
   приложения ничего личного не лежит. Замена полная и необратимая, так что
   спрашиваем подтверждение — по старой ссылке, открытой через полгода,
   иначе молча улетел бы весь прогресс.
   ------------------------------------------------------------ */
function b64urlDecode(t){
  const b=atob(t.replace(/-/g,'+').replace(/_/g,'/'));
  const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return new TextDecoder().decode(u);
}
/** Разбирает полезную нагрузку ссылки. Даты без часового пояса
    (`2026-08-22T02:00`) читаются как местное время — так и задумано:
    «02:00» должно остаться двумя часами ночи на том телефоне, где открыли. */
function parseSeed(hash){
  const m=/^#seed=([A-Za-z0-9\-_=]+)$/.exec(hash||'');
  if(!m)return null;
  let d;
  try{d=JSON.parse(b64urlDecode(m[1]))}catch(e){return null}
  if(!d||!Array.isArray(d.habits)||!d.habits.length)return null;
  const habits=d.habits.map((h,i)=>{
    const kind=KINDS[h.kind]?h.kind:'custom';
    const t=new Date(h.startedAt);
    if(isNaN(t))return null;
    return mkHabit({name:String(h.name||KINDS[kind].title),kind,
                    color:h.color||KINDS[kind].color,emoji:h.emoji,startedAt:t.toISOString(),
                    wakeBy:h.wakeBy||'07:00'});
  });
  return habits.every(Boolean)?habits:null;
}
function seedFromLink(){
  const habits=parseSeed(location.hash);
  const had=location.hash.indexOf('#seed=')===0;
  if(had)history.replaceState(null,'',location.pathname+location.search);  // второй раз не спросим
  if(!had)return;
  if(!habits)return toast('Ссылка повреждена');
  const n=habits.length;
  sheet(n+' '+plural(n,'привычка','привычки','привычек')+' из ссылки заменят всё, что сейчас в приложении.',[
    {ico:'⬇︎',label:'Загрузить',act:'seedApply',cls:'danger'},
  ]);
  pendingSeed=habits;
}
let pendingSeed=null;

/* ------------------------------------------------------------
   Жесты списка
   Свайп влево — открыть действия. Долгий тап — перетащить карточку.
   Оба жеста живут на одном касании и расходятся по первому движению:
   ушёл вбок — свайп, вниз — обычная прокрутка, не двинулся — перетаскивание.
   ------------------------------------------------------------ */
const LP_MS=420;                // сколько держать, чтобы карточка поднялась
const SW={row:null,open:null,x0:0,y0:0,dx:0,base:0,mode:null,lp:0,moved:false,
          rows:null,step:0,from:0,to:0};
let swipeGuard=false;           // клик после жеста глотаем: это не тап

/* Рядов со свайпом два вида: карточка привычки в списке и строка срыва на
   экране привычки. Устроены одинаково — плашка поверх кнопок, — поэтому
   жест один на оба, а различает их только пара селекторов. */
const ROWS='.hrow,.rel-row';
const cardOf=row=>row&&row.querySelector('.hcard,.rel-card');
const actsW=row=>{const a=row&&row.querySelector('.hrow-acts,.rel-acts');return a?a.offsetWidth:140};

function closeRow(row,instant){
  if(!row)return;
  const c=cardOf(row);
  if(c){c.classList.toggle('raw',!!instant);c.style.transform='';c.style.setProperty('--fade','1');
        if(instant)requestAnimationFrame(()=>c.classList.remove('raw'))}
  row.classList.remove('open');
  if(SW.open===row)SW.open=null;
}
function openRow(row){
  const c=cardOf(row);if(!c)return;
  c.classList.remove('raw');
  c.style.transform=`translateX(${-actsW(row)}px)`;
  c.style.setProperty('--fade','0');
  row.classList.add('open');
  SW.open=row;
}

function listStart(e){
  swipeGuard=false;
  if(e.touches.length>1){SW.row=null;return}
  const t=e.touches[0],row=e.target.closest?e.target.closest(ROWS):null;
  if(SW.open&&row!==SW.open){closeRow(SW.open);swipeGuard=true}
  if(!row||e.target.closest('.hrow-acts,.rel-acts')){SW.row=null;return}
  SW.row=row;SW.x0=t.clientX;SW.y0=t.clientY;SW.dx=0;SW.mode=null;SW.moved=false;
  SW.base=row===SW.open?-actsW(row):0;
  clearTimeout(SW.lp);
  // перетаскиванием меняют порядок только привычки; срывы стоят по времени
  if(row.classList.contains('hrow'))
    SW.lp=setTimeout(()=>{if(SW.row===row&&!SW.mode)dragStart(row)},LP_MS);
}
function listMove(e){
  if(!SW.row)return;
  const t=e.touches[0],dx=t.clientX-SW.x0,dy=t.clientY-SW.y0;
  if(!SW.mode){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){SW.mode='x';clearTimeout(SW.lp)}
    else if(Math.abs(dy)>8){clearTimeout(SW.lp);SW.row=null;return}   // это прокрутка
    else return;
  }
  if(SW.mode==='x'){
    e.preventDefault();
    const w=actsW(SW.row);
    let x=SW.base+dx;
    if(x>0)x*=.25;                       // вправо тянуть некуда — резинка
    else if(x<-w)x=-w+(x+w)*.3;          // и за упором тоже
    SW.dx=x;SW.moved=true;
    const c=cardOf(SW.row);
    c.classList.add('raw');c.style.transform=`translateX(${x}px)`;
    c.style.setProperty('--fade',clamp(1+x/w*1.7,0,1).toFixed(2));
  }else if(SW.mode==='drag'){
    e.preventDefault();
    dragMove(dy);
  }
}
function listEnd(){
  clearTimeout(SW.lp);
  const row=SW.row;
  if(row&&SW.mode==='x'){
    if(SW.dx<-actsW(row)*.45)openRow(row);else closeRow(row);
    swipeGuard=SW.moved;
  }else if(row&&SW.mode==='drag'){
    dragEnd();swipeGuard=true;
  }
  SW.row=null;SW.mode=null;
}

/* --- перетаскивание: карточки одинаковой высоты, поэтому позиция
       считается шагом, а соседи просто разъезжаются --- */
function dragStart(row){
  if(S.habits.length<2)return;
  SW.mode='drag';
  closeRow(SW.open,true);
  SW.rows=[...$('list').querySelectorAll('.hrow')];
  SW.from=SW.rows.indexOf(row);SW.to=SW.from;
  SW.step=row.offsetHeight+10;
  if(SW.from<0){SW.mode=null;return}
  SW.rows.forEach(r=>{r.style.transition='transform .2s var(--ease)'});
  row.style.transition='none';
  row.classList.add('lift');
  if(navigator.vibrate)navigator.vibrate(8);
}
function dragMove(dy){
  const n=SW.rows.length;
  SW.rows[SW.from].style.transform=`translateY(${dy}px)`;
  const to=clamp(SW.from+Math.round(dy/SW.step),0,n-1);
  if(to===SW.to)return;
  SW.to=to;
  SW.rows.forEach((r,i)=>{
    if(i===SW.from)return;
    const off=(i>SW.from&&i<=to)?-SW.step:(i<SW.from&&i>=to)?SW.step:0;
    r.style.transform=off?`translateY(${off}px)`:'';
  });
}
function dragEnd(){
  const row=SW.rows[SW.from],from=SW.from,to=SW.to;
  row.style.transition='transform .22s var(--ease)';
  row.style.transform=`translateY(${(to-from)*SW.step}px)`;
  row.classList.remove('lift');
  setTimeout(()=>{
    if(from!==to){const[m]=S.habits.splice(from,1);S.habits.splice(to,0,m);save()}
    if(view==='list')renderList();
  },230);
}

function bindList(){
  for(const el of [$('list'),$('home')]){
    el.addEventListener('touchstart',listStart,{passive:true});
    el.addEventListener('touchmove',listMove,{passive:false});
    el.addEventListener('touchend',listEnd);
    el.addEventListener('touchcancel',listEnd);
  }
}

/** Уйти к списку: живые узлы привычки больше не нужны. */
function goList(animate){
  view='list';R={};
  $('home').innerHTML='';$('home').className='';
  $('app').dataset.view='list';
  renderList(animate!==false);renderTop();
  window.scrollTo(0,0);
}

let chartRange=365,chartTouchDay=null,chartStaticKey='',pulseRAF=null,liveTimer=null;
function openChart(){
  const h=active();if(!h||!hasCurve(h.kind))return;
  const days=elapsed(h)/D;
  chartRange=days>1825?3650:days>365?1825:days>180?365:days>90?180:days>30?90:30;
  chartTouchDay=null;chartStaticKey='';
  const RANGES=[[30,'1 мес'],[90,'3 мес'],[180,'6 мес'],[365,'1 год'],[1825,'5 лет'],[3650,'10 лет']];
  openPage('p-chart',
    pageBar('','closeChart')+
    `<div class="ch-live">
      <span class="ch-lab">Тяга</span>
      <div class="ch-num num" id="ch-num"></div>
      <div class="ch-mot" id="ch-mot"></div>
    </div>
    <div class="ch-range">${RANGES.map(r=>
      `<button class="rb ${r[0]===chartRange?'on':''}" data-act="chRange" data-arg="${r[0]}">${r[1]}</button>`).join('')}</div>
    <div class="ch-wrap" id="ch-wrap"><canvas id="ch-static"></canvas><canvas id="ch-live"></canvas></div>
    <div class="ch-info" data-act="chInfo">Основано на научных данных <span class="ch-arrow" id="ch-arrow">›</span></div>
    <div class="ch-body" id="ch-body">${chartNote(h.kind)}</div>`);
  setupChartTouch();
  requestAnimationFrame(()=>{drawStatic(0);animateChart()});
  clearInterval(liveTimer);liveTimer=setInterval(updateChartNum,100);
  updateChartNum();
}
function closeChart(){
  closePage('p-chart');
  clearInterval(liveTimer);liveTimer=null;
  cancelAnimationFrame(pulseRAF);pulseRAF=null;
}
function updateChartNum(){
  const h=active();if(!h||!hasCurve(h.kind))return;
  const sec=elapsed(h),v=craving(h.kind,sec),dig=cravingDigits(h.kind,sec);
  const str=v.toFixed(dig),i=str.indexOf('.'),z=zoneOf(v);
  const n=$('ch-num');
  if(n)n.innerHTML=`<span class="ch-int" style="color:${z.color}">${str.slice(0,i)}</span><span class="ch-dot" style="color:${z.color}">.</span><span class="ch-dec">${str.slice(i+1)}</span><span class="ch-pct">%</span>`;
  const m=$('ch-mot');if(m)m.textContent=motive(v);
}
function chartMetrics(){
  const wrap=$('ch-wrap');if(!wrap)return null;
  const W=wrap.clientWidth||320,H=wrap.clientHeight||220;
  return{W,H,pad:{t:14,r:14,b:24,l:30},dpr:Math.min(devicePixelRatio||1,3)};
}
function prep(canvas,m){
  canvas.width=m.W*m.dpr;canvas.height=m.H*m.dpr;
  const ctx=canvas.getContext('2d');ctx.setTransform(m.dpr,0,0,m.dpr,0,0);
  ctx.clearRect(0,0,m.W,m.H);return ctx;
}
const Y_MAX=108;
function xPx(d,m){return m.pad.l+(d/chartRange)*(m.W-m.pad.l-m.pad.r)}
function yPx(v,m){const ch=m.H-m.pad.t-m.pad.b;return m.pad.t+ch-(clamp(v,0,Y_MAX)/Y_MAX)*ch}

/** Статический слой: сетка, заливка, кривая, подписи. Перерисовывается только при смене диапазона. */
function drawStatic(progress){
  const h=active(),m=chartMetrics();if(!h||!m)return;
  const ctx=prep($('ch-static'),m);
  const cw=m.W-m.pad.l-m.pad.r,ch=m.H-m.pad.t-m.pad.b;
  const f=CURVES[h.kind];if(!f)return;

  ctx.font='500 9px -apple-system,sans-serif';ctx.textAlign='right';
  [0,25,50,75,100].forEach(y=>{
    ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(m.pad.l,yPx(y,m));ctx.lineTo(m.pad.l+cw,yPx(y,m));ctx.stroke();
    ctx.fillStyle='rgba(154,154,160,.55)';ctx.fillText(y+'%',m.pad.l-5,yPx(y,m)+3);
  });
  const ticks=chartRange<=30?[[7,'1н'],[14,'2н'],[30,'1м']]
    :chartRange<=90?[[30,'1м'],[60,'2м'],[90,'3м']]
    :chartRange<=180?[[30,'1м'],[90,'3м'],[180,'6м']]
    :chartRange<=365?[[30,'1м'],[90,'3м'],[180,'6м'],[365,'1г']]
    :chartRange<=1825?[[365,'1г'],[730,'2г'],[1095,'3г'],[1825,'5л']]
    :[[365,'1г'],[1095,'3г'],[1825,'5л'],[2555,'7л'],[3650,'10л']];
  ctx.textAlign='center';
  ticks.forEach(t=>{
    if(t[0]>chartRange)return;
    ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(xPx(t[0],m),m.pad.t);ctx.lineTo(xPx(t[0],m),m.pad.t+ch);ctx.stroke();
    ctx.fillStyle='rgba(154,154,160,.55)';ctx.fillText(t[1],xPx(t[0],m),m.H-m.pad.b+13);
  });

  const STEPS=340,upTo=Math.floor(STEPS*clamp(progress,0,1));
  if(upTo<1)return;
  const pts=[];
  for(let i=0;i<=upTo;i++){const d=i/STEPS*chartRange;pts.push([xPx(d,m),yPx(f(d*D),m)])}

  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.lineTo(pts[pts.length-1][0],yPx(0,m));ctx.lineTo(pts[0][0],yPx(0,m));ctx.closePath();
  const g=ctx.createLinearGradient(0,m.pad.t,0,m.pad.t+ch);
  g.addColorStop(0,'rgba(255,69,58,.30)');g.addColorStop(.45,'rgba(255,159,10,.12)');g.addColorStop(1,'rgba(48,209,88,.02)');
  ctx.fillStyle=g;ctx.fill();

  const lg=ctx.createLinearGradient(m.pad.l,0,m.pad.l+cw,0);
  lg.addColorStop(0,'#ff453a');lg.addColorStop(.2,'#ff9f0a');lg.addColorStop(.45,'#ffd60a');lg.addColorStop(1,'#30d158');
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=lg;ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
}

/** Живой слой: только точка «ты здесь» и тултип. Дёшево рисовать каждый кадр. */
function drawLive(ts){
  const h=active(),m=chartMetrics();if(!h||!m)return;
  const f=CURVES[h.kind];if(!f)return;
  const ctx=prep($('ch-live'),m);
  const ch=m.H-m.pad.t-m.pad.b;
  const days=elapsed(h)/D;

  if(days<=chartRange){
    const v=f(days*D),cx=xPx(days,m),cy=yPx(v,m),z=zoneOf(v);
    const pulse=(Math.sin(ts/680)+1)/2,rr=9+pulse*7;
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
    rg.addColorStop(0,`rgba(255,255,255,${.13+pulse*.10})`);rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,rr,0,6.29);ctx.fill();
    ctx.fillStyle=z.color;ctx.beginPath();ctx.arc(cx,cy,5,0,6.29);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=1.6;ctx.stroke();
    if(chartTouchDay===null){
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='600 10px -apple-system,sans-serif';
      const right=days>chartRange*.7;ctx.textAlign=right?'right':'left';
      ctx.fillText('Ты здесь',cx+(right?-12:12),cy-11);
    }
  }
  if(chartTouchDay!==null){
    const d=chartTouchDay,v=f(d*D),tx=xPx(d,m),ty=yPx(v,m),z=zoneOf(v);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(tx,m.pad.t);ctx.lineTo(tx,m.pad.t+ch);ctx.stroke();ctx.setLineDash([]);
    const gg=ctx.createRadialGradient(tx,ty,0,tx,ty,16);
    gg.addColorStop(0,'rgba(255,255,255,.2)');gg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(tx,ty,16,0,6.29);ctx.fill();
    ctx.fillStyle=z.color;ctx.beginPath();ctx.arc(tx,ty,5.5,0,6.29);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=1.6;ctx.stroke();
    const lab=d<1?Math.round(d*24)+' ч':d<7?Math.round(d)+' '+plural(Math.round(d),'день','дня','дней')
      :d<30?Math.round(d/7)+' нед':d<365?(d/30).toFixed(1)+' мес':(d/365).toFixed(1)+' г';
    const bw=96,bh=52;
    let bx=tx+16;if(bx+bw>m.W-m.pad.r-2)bx=tx-bw-16;
    bx=clamp(bx,2,m.W-bw-2);
    const by=clamp(ty-bh/2,m.pad.t+2,m.pad.t+ch-bh-2);
    ctx.fillStyle='rgba(22,22,25,.97)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,13);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=z.color;ctx.font='700 18px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText(v.toFixed(1)+'%',bx+bw/2,by+22);
    ctx.fillStyle='rgba(154,154,160,.85)';ctx.font='500 11px -apple-system,sans-serif';
    ctx.fillText(lab,bx+bw/2,by+39);
  }
}
function animateChart(){
  cancelAnimationFrame(pulseRAF);
  const DUR=prefersReduced()?1:620,t0=performance.now();
  (function step(t){
    const k=clamp((t-t0)/DUR,0,1);
    if(k<1){drawStatic(easeOut(k));drawLive(t);pulseRAF=requestAnimationFrame(step)}
    else{drawStatic(1);pulseLoop()}
  })(t0);
}
function pulseLoop(){
  cancelAnimationFrame(pulseRAF);
  (function step(t){drawLive(t);pulseRAF=requestAnimationFrame(step)})(performance.now());
}
function setupChartTouch(){
  const c=$('ch-live'),wrap=$('ch-wrap');if(!c||!wrap)return;
  const dayAt=x=>{
    const r=wrap.getBoundingClientRect(),m=chartMetrics();
    return clamp((x-r.left-m.pad.l)/(r.width-m.pad.l-m.pad.r)*chartRange,0,chartRange);
  };
  let clear=null;
  const set=x=>{chartTouchDay=dayAt(x);clearTimeout(clear)};
  wrap.addEventListener('touchstart',e=>{e.preventDefault();set(e.touches[0].clientX)},{passive:false});
  wrap.addEventListener('touchmove',e=>{e.preventDefault();set(e.touches[0].clientX)},{passive:false});
  wrap.addEventListener('touchend',()=>{clearTimeout(clear);clear=setTimeout(()=>chartTouchDay=null,1800)});
  wrap.addEventListener('mousemove',e=>set(e.clientX));
  wrap.addEventListener('mouseleave',()=>chartTouchDay=null);
}

          <div class="colors">${PALETTE.map(c=>`<div class="col ${form.color===c?'on':''}" data-act="editColor" data-arg="${c}" style="background:${c};color:${c}"></div>`).join('')}</div>
        </div>
        <div class="f-group">
          <div class="f-label">Значок</div>
          ${emojiPicker(form.emoji,'editEmoji','e-emoji',form.color)}

          <div class="f-label">Во сколько вставать</div>
          <input class="f-input" id="e-wake" type="time" value="${wakeBy(h)}">
        </div>`:''}
        <div class="f-group">
          <div class="f-label">${isDaily(h)?'Ведём режим с':'Начало отсчёта'}</div>
          <div class="f-row">

  importV1(){

  setDay(_id,el){

  closeDay(){closePage('p-day')},
  saveDay(_id,el){

  const t=e.target.closest('[data-act]');

/* ------------------------------------------------------------
   Жест «назад»
   Свайп от левого края тянет верхний экран вправо, под ним выезжает
   предыдущий. Реализован сам, а не через историю браузера: записи,
   добавленные pushState, Safari не снимает и рисует на их месте белый
   прямоугольник (см. ниже).
   ------------------------------------------------------------ */
const EDGE=32;                   // полоса у левого края, с которой начинается жест
const NAV={armed:false,on:false,x0:0,y0:0,dx:0,w:0,node:null,kind:null,t0:0};
let navUnder=null;

function navTarget(){
  if(openPages.length)return{kind:'page',node:$(openPages[openPages.length-1])};
  if(view==='habit')return{kind:'habit',node:$('home')};
  return null;                   // на списке возвращаться некуда
}
function navBegin(){
  const n=NAV.node;
  n.classList.remove('slide-in');     // иначе анимация въезда держит transform
  n.style.transition='none';
  if(NAV.kind==='habit'){
    $('app').classList.add('navigating');
    renderList();                // список рисуем заранее — жест открывает его, а не пустоту
    const list=$('list');
    // абсолютные координаты считаются от padding-бокса #app, поэтому берём
    // не высоту шапки, а место, где начинается сам экран привычки
    list.style.top=$('home').offsetTop+'px';
    navUnder=list;
  }else{
    navUnder=(view==='habit')?$('home'):$('list');
  }
  if(navUnder)navUnder.style.transition='none';
}
function navDraw(p){
  p=clamp(p,0,1);
  NAV.node.style.transform=`translateX(${(p*NAV.w).toFixed(1)}px)`;
  if(navUnder)navUnder.style.transform=`translateX(${(-20*(1-p)).toFixed(2)}%)`;
}
function navReset(){
  if(NAV.node){NAV.node.style.transition='';NAV.node.style.transform=''}
  if(navUnder){navUnder.style.transition='';navUnder.style.transform='';navUnder.style.top=''}
  $('app').classList.remove('navigating');
  navUnder=null;NAV.node=null;NAV.on=false;NAV.armed=false;
}
function navFinish(){
  const kind=NAV.kind,node=NAV.node;
  node.style.transition='transform .24s var(--ease)';
  if(navUnder)navUnder.style.transition='transform .24s var(--ease)';
  navDraw(1);
  NAV.on=false;NAV.armed=false;
  setTimeout(()=>{
    if(kind==='page'){
      const id=openPages[openPages.length-1];
      // сначала снимаем экран, потом чистим инлайн-стили: он уже невидим,
      // поэтому подмена не мелькает
      if(id==='p-chart')closeChart();else if(id)closePage(id);
      node.style.transition='';node.style.transform='';
      if(navUnder){navUnder.style.transition='';navUnder.style.transform='';navUnder.style.top=''}
      $('app').classList.remove('navigating');
      navUnder=null;NAV.node=null;
    }else{
      goList(false);             // без своей анимации: экран уже уехал руками
      navReset();
    }
  },250);
}
function navCancel(){
  NAV.node.style.transition='transform .22s var(--ease)';
  if(navUnder)navUnder.style.transition='transform .22s var(--ease)';
  navDraw(0);
  NAV.on=false;NAV.armed=false;
  setTimeout(navReset,230);
}
function navStart(e){
  if(NAV.on||e.touches.length>1)return;
  const t=e.touches[0];
  if(t.clientX>EDGE)return;
  const tg=navTarget();if(!tg||!tg.node)return;
  NAV.armed=true;NAV.on=false;NAV.dx=0;
  NAV.x0=t.clientX;NAV.y0=t.clientY;NAV.w=window.innerWidth||390;
  NAV.node=tg.node;NAV.kind=tg.kind;NAV.t0=Date.now();
}
function navMove(e){
  if(!NAV.armed)return;
  const t=e.touches[0],dx=t.clientX-NAV.x0,dy=t.clientY-NAV.y0;
  if(!NAV.on){
    if(Math.abs(dy)>Math.abs(dx)){NAV.armed=false;return}   // это прокрутка
    if(dx<8)return;
    NAV.on=true;navBegin();
  }
  e.preventDefault();
  NAV.dx=Math.max(0,dx);
  navDraw(NAV.dx/NAV.w);
}
function navEnd(){
  if(!NAV.on){NAV.armed=false;NAV.node=null;return}
  // либо утянул треть экрана, либо бросил — а бросок это скорость, а не просто
  // «уложился в триста миллисекунд»: медленные короткие свайпы должны отменяться
  const p=NAV.dx/NAV.w, v=NAV.dx/Math.max(1,Date.now()-NAV.t0);
  if(p>0.3||(v>0.55&&NAV.dx>56))navFinish();else navCancel();
}
function bindNav(){
  document.addEventListener('touchstart',navStart,{passive:true});
  document.addEventListener('touchmove',navMove,{passive:false});
  document.addEventListener('touchend',navEnd);
  document.addEventListener('touchcancel',navEnd);
}

/* Записей в истории браузера приложение не создаёт — намеренно.
   Раньше оно клало пустышку через pushState, чтобы жест «назад» закрывал
   открытый экран, а не выбрасывал из приложения. Но Safari не делает снимок
   для записи, добавленной pushState в том же документе, и при свайпе от левого
   края показывал вместо неё белый прямоугольник — на несколько секунд, пока
   идёт межстраничный переход. Снимка нет и не будет, поэтому лечится это
   только отказом от лишних записей: без них свайпу некуда возвращаться и он
   просто ничего не делает. Экраны закрываются стрелкой, лист — кнопкой. */

/* Пауза при сворачивании — не жечь батарею в фоне */
document.addEventListener('visibilitychange',()=>{
  running=!document.hidden;
  if(running){
    updateCraving(true);updateOdometer(true);
    const h=active();if(h)setGlow(habitColor(h));
  }else saveNow();
});
window.addEventListener('pagehide',saveNow);
addEventListener('resize',()=>{
  if($('p-chart').classList.contains('on')){drawStatic(1)}
});

/* ------------------------------------------------------------
   Старт
   ------------------------------------------------------------ */
S=load();
// первый запуск: если есть данные из v1 — переносим сразу, старое не трогаем
if(!localStorage.getItem(KEY)&&!S.habits.length&&v1Available()){
  const n=importFromV1();
  if(n)setTimeout(()=>toast('Перенесено из askeza 1: '+n+' '+plural(n,'привычка','привычки','привычек')),700);
}
S.habits.forEach(h=>{if(!h.history.length)h.history.push({t:'start',at:h.startedAt})});
bindList();
bindNav();
renderHome(true);
requestAnimationFrame(loop);
setTimeout(seedFromLink,500);

if('serviceWorker'in navigator&&location.protocol!=='blob:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* Точка входа для автотестов */
window.__askeza={
  get S(){return S},
  plural,breakdown,localDate,craving,cravingDigits,zoneOf,buildCurve,CRAVING,CURVES,
  elapsed,active,renderHome,guessKind,
  esc,fmtLeft,fmtRough,nDays,KINDS,
  isDaily,today,shiftDay,streakInfo,openDays,streakDays,calendarCells,dailyStats,
  markDay,wakeBy,checksOf,hasCurve,
  segFills,cardDays,SEG_STOPS,SEG_LABELS,stepIndex,relapses,dropRelapse,relMerged,goList,parseSeed,seedFromLink,EMOJI_QUICK,emojiOf,lastGrapheme,
  get view(){return view},
  openHabit(id){ACT.openHabit(id)},
  set(next){S=normalize(next);saveNow();view='list';renderHome(true)},
};
