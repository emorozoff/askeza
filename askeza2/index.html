<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta http-equiv="refresh" content="4;url=../">
<title>askeza переехала</title>
<style>
  html,body{height:100%;margin:0;background:#0b0b0d;color:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  p{margin:0;color:#9a9aa0;font-size:15px;line-height:1.5}
  a{display:inline-block;padding:13px 26px;border-radius:14px;background:#2aabee;color:#fff;
    text-decoration:none;font-size:16px;font-weight:650}
</style>
</head>
<body>
<div class="box">
  <p>askeza переехала на страницу выше.<br>Данные и привычки остались на месте.</p>
  <a href="../">Открыть askeza</a>
</div>
<script>
/* Приложение жило здесь до v2.3, а теперь лежит в корне. У тех, кто добавил
   его на экран отсюда, остался service worker со старой областью действия:
   он будет отдавать страницу, которой больше нет. Снимаем только его —
   getRegistration() без аргументов берёт регистрацию для этого адреса,
   а не все на домене, поэтому корневой воркер не пострадает. */
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.unregister();
    }
  } catch (e) {}
  location.replace('../');
})();
</script>
</body>
</html>
