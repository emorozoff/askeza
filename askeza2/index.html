<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="askeza">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>askeza</title>
<style>
/* ============================================================
   askeza 2 — дизайн-система
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0b0d;
  --surface:#17171a;
  --surface2:#232326;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#f5f5f7;
  --text2:#9a9aa0;
  --text3:#6e6e76;
  --accent:#2aabee;
  --red:#ff453a;
  --orange:#ff9f0a;
  --yellow:#ffd60a;
  --green:#30d158;
  --bronze:#cd7f32;--silver:#b6b6be;--gold:#ffd60a;--plat:#c4a7ff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.8,.26,1);
  --spring:cubic-bezier(.34,1.42,.64,1);
}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* Фоновое свечение текущей фазы. currentColor внутри градиента
   позволяет плавно перетекать между фазами одной transition. */
#glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  color:#2aabee;opacity:.20;
  background:radial-gradient(135% 52% at 50% -10%,currentColor 0%,transparent 72%);
  transition:color 1.4s var(--ease),opacity 1.4s var(--ease);
}
#app{position:relative;z-index:1;padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bottom) + 28px)}

/* ---------------- анимации ---------------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.82)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes flipIn{0%{opacity:0;transform:perspective(700px) rotateY(-75deg) scale(.8)}55%{transform:perspective(700px) rotateY(9deg) scale(1.05)}100%{opacity:1;transform:perspective(700px) rotateY(0) scale(1)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes haloPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.05)}50%{box-shadow:0 0 0 7px rgba(255,255,255,.02)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shine{0%{background-position:-160% 0}100%{background-position:260% 0}}

.stagger>*{animation:fadeUp .5s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}
.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}
.stagger>*:nth-child(8){animation-delay:.37s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #glow{transition:none}
}

/* ---------------- топбар ---------------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;animation:fadeIn .4s ease}
.brand{display:flex;align-items:baseline;gap:7px}
.brand h1{font-size:23px;font-weight:800;letter-spacing:-.4px;color:#fff}
.brand .ver{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.4px}
.tb-actions{display:flex;gap:2px}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;
  color:var(--text2);border-radius:50%;cursor:pointer;transition:background .2s,transform .15s,color .2s}
.icon-btn:active{background:var(--surface2);transform:scale(.9)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------------- шапка привычки ---------------- */
.h-head{text-align:center;padding:2px 24px 0}
.h-name{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.15;color:#fff;word-break:break-word}
.h-since{font-size:12.5px;color:var(--text3);margin-top:5px;font-weight:450}

/* ---------------- герой: кольцо ---------------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:14px 20px 4px}
.ring-wrap{position:relative;width:224px;height:224px;cursor:pointer;transition:transform .2s var(--ease)}
.ring-wrap:active{transform:scale(.975)}
.ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:9}
.ring-track.dashed{stroke-dasharray:2 11;stroke-linecap:round;stroke-width:5;stroke:rgba(255,255,255,.16)}
.ring-fill{fill:none;stroke-width:9;stroke-linecap:round;
  transition:stroke-dashoffset 1.15s var(--ease)}
.ring-fill.live{transition:stroke-dashoffset .35s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring-big{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:.98;color:#fff}
.ring-unit{font-size:14px;font-weight:600;color:var(--text2);margin-top:5px;letter-spacing:.2px}
.ring-of{font-size:12.5px;font-weight:600;color:var(--text3);margin-top:3px}
.hero-left{font-size:13px;color:var(--text2);margin-top:12px;font-weight:550;letter-spacing:.1px}
.hero-left b{color:var(--text);font-weight:700}
.vow-cta{margin-top:14px;padding:11px 26px;white-space:nowrap;border:1px solid var(--line2);background:rgba(255,255,255,.045);
  border-radius:22px;font-size:14.5px;font-weight:650;color:var(--text);cursor:pointer;
  transition:transform .15s,background .2s;display:flex;align-items:center;gap:7px}
.vow-cta:active{transform:scale(.96);background:rgba(255,255,255,.09)}

/* ---------------- карточки ---------------- */
.card{margin:0 16px 10px;background:var(--surface);border-radius:20px;border:1px solid var(--line);
  cursor:pointer;transition:transform .16s var(--ease),background .2s}
.card:active{transform:scale(.982);background:var(--surface2)}
.card.flat{cursor:default}
.card.flat:active{transform:none;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row-body{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:650;color:var(--text)}
.row-sub{font-size:12.5px;color:var(--text3);margin-top:2px;line-height:1.4}
.chev{color:var(--text3);flex-shrink:0;width:8px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* карточка тяги */
.craving{padding:14px 16px}
.craving-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.craving-label{font-size:10.5px;font-weight:700;color:var(--text3);letter-spacing:1.1px;text-transform:uppercase}
.craving-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.craving-num{display:flex;align-items:baseline;line-height:1}
.cv-int{font-size:38px;font-weight:800;letter-spacing:-1.6px}
.cv-dot{font-size:30px;font-weight:800}
.cv-dec{font-size:19px;font-weight:650;opacity:.62}
.cv-pct{font-size:17px;font-weight:650;opacity:.42;margin-left:3px}
.zone{font-size:11px;font-weight:700;padding:5px 11px;border-radius:9px;white-space:nowrap;letter-spacing:.1px}

/* одометр */
.odo{padding:0 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:5px}
.obar{position:relative;height:31px;background:var(--surface);border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.obar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:11px;opacity:.94}
.obar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:2px;border-radius:2px;
  background:rgba(255,255,255,.55);box-shadow:0 0 7px rgba(255,255,255,.3)}
.obar::after{content:'';position:absolute;left:0;top:0;bottom:0;width:62%;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(0,0,0,.52) 0%,rgba(0,0,0,.18) 58%,transparent 100%)}
.obar-txt{position:absolute;inset:0;z-index:2;display:flex;align-items:center;gap:6px;padding-left:13px;pointer-events:none}
.obar-n{font-size:18px;font-weight:750;color:#fff;letter-spacing:-.3px}
.obar-l{font-size:11.5px;font-weight:550;color:rgba(255,255,255,.82)}

/* режим: отметка дня, календарь, статистика */
.checkin{margin:0 16px 10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.ci-btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:16.5px;font-weight:700;cursor:pointer;
  color:#fff;transition:transform .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:9px}
.ci-btn:active{transform:scale(.978);opacity:.88}
.ci-done{display:flex;align-items:center;gap:12px}
.ci-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0}
.ci-t{font-size:15.5px;font-weight:700}
.ci-s{font-size:12.5px;color:var(--text3);margin-top:2px}
.ci-edit{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;padding:8px;cursor:pointer}
.ask{margin:0 16px 10px;padding:14px 16px;background:rgba(255,159,10,.09);border:1px solid rgba(255,159,10,.3);border-radius:18px}
.ask-t{font-size:14.5px;font-weight:650;margin-bottom:3px}
.ask-s{font-size:12.5px;color:var(--text3);margin-bottom:11px}
.ask-b{display:flex;gap:8px}
.ask-b button{flex:1;padding:12px;border:none;border-radius:13px;font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .15s}
.ask-b button:active{transform:scale(.95)}
.ask-yes{background:rgba(48,209,88,.18);color:#4ade80}
.ask-no{background:rgba(255,69,58,.16);color:#ff6a60}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px}
.cal-h{padding-bottom:6px}
.cal-h span{text-align:center;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.3px}
.cal{margin-bottom:12px}
.cal-d{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;color:var(--text3);background:rgba(255,255,255,.045);
  transition:transform .2s var(--spring)}
.cal-d.ok{background:#30d158;color:#052e12;font-weight:750}
.cal-d.miss{background:rgba(255,69,58,.2);color:#ff6a60}
.cal-d.out{opacity:.2}
.cal-d.today{box-shadow:0 0 0 2px var(--accent)}
.dstat{display:flex;gap:8px;padding:0 16px 10px}

/* фаза */
.phase-rank{font-size:25px;font-weight:800;font-family:'Times New Roman',Georgia,serif;min-width:40px;text-align:center;line-height:1;flex-shrink:0}
.phase-tier{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.phase-desc{font-size:12.5px;color:var(--text3);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* SOS */
.sos-btn{display:flex;align-items:center;justify-content:center;gap:9px;margin:4px 16px 12px;padding:15px;
  width:calc(100% - 32px);border-radius:18px;border:1px solid rgba(255,69,58,.35);
  background:rgba(255,69,58,.09);color:#ff6a60;font-size:15.5px;font-weight:750;cursor:pointer;
  transition:transform .15s,background .2s;letter-spacing:.2px}
.sos-btn:active{transform:scale(.975);background:rgba(255,69,58,.18)}
.sos-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* цитата */
.quote{margin:6px 30px 0;text-align:center;font-size:13px;color:var(--text2);line-height:1.62;
  cursor:pointer;user-select:none;font-weight:450}
.quote span{display:inline-block;transition:opacity .22s,transform .22s}
.quote:active{opacity:.55}

/* пустой экран */
.empty{text-align:center;padding:72px 34px;animation:fadeUp .5s var(--ease)}
.empty-ico{font-size:52px;margin-bottom:18px}
.empty h2{font-size:20px;font-weight:750;margin-bottom:9px}
.empty p{font-size:14px;color:var(--text2);line-height:1.55;margin-bottom:26px}

.btn{display:block;width:100%;padding:15px;border:none;border-radius:16px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .2s;letter-spacing:.1px}
.btn:active{transform:scale(.978);opacity:.88}
.btn:disabled{opacity:.32;pointer-events:none}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.inline{width:auto;padding:14px 32px;display:inline-block}
.btn.danger{background:rgba(255,69,58,.14);color:var(--red)}

/* ---------------- меню привычек ---------------- */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.menu{position:fixed;top:calc(var(--safe-top) + 50px);right:10px;width:min(300px,calc(100vw - 20px));
  background:#1a1a1d;border-radius:17px;z-index:61;overflow:hidden;
  box-shadow:0 12px 44px rgba(0,0,0,.66),0 0 0 .5px rgba(255,255,255,.1);
  transform:translateY(-10px) scale(.94);transform-origin:top right;opacity:0;pointer-events:none;
  transition:transform .26s var(--spring),opacity .18s ease}
.menu.on{transform:none;opacity:1;pointer-events:auto}
.menu-h{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;padding:12px 15px 7px}
.m-item{display:flex;align-items:center;gap:11px;padding:11px 15px;cursor:pointer;border-top:1px solid rgba(255,255,255,.05);
  background:#1a1a1d;transition:background .15s}
.m-item:active{background:#242428}
.m-bar{width:3.5px;height:34px;border-radius:2px;flex-shrink:0}
.m-info{flex:1;min-width:0}
.m-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sub{font-size:11.5px;color:var(--text3);margin-top:1px}
.m-check{color:var(--accent);width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.m-add{width:100%;padding:13px 15px;background:none;border:none;border-top:1px solid rgba(255,255,255,.08);
  color:var(--accent);font-size:15px;font-weight:650;cursor:pointer;text-align:left;transition:background .15s}
.m-add:active{background:#242428}

/* ---------------- нижний шит ---------------- */
.sheet-bd{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s;
  display:flex;align-items:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-bd.on{opacity:1;pointer-events:auto}
.sheet{width:100%;background:#1c1c1f;border-radius:22px 22px 0 0;padding:0 14px calc(var(--safe-bottom) + 14px);
  transform:translateY(100%);transition:transform .34s var(--ease);border-top:1px solid var(--line2)}
.sheet-bd.on .sheet{transform:none}
.sheet-grip{width:38px;height:4.5px;background:rgba(255,255,255,.18);border-radius:3px;margin:10px auto 6px}
.sheet-title{text-align:center;font-size:13px;color:var(--text3);padding:6px 20px 12px;line-height:1.5}
.s-item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 8px;border:none;background:none;
  font-size:16.5px;color:var(--text);cursor:pointer;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);transition:opacity .15s}
.s-item:last-of-type{border-bottom:none}
.s-item:active{opacity:.5}
.s-item.danger{color:var(--red)}
.s-item.warn{color:var(--orange)}
.s-ico{width:26px;text-align:center;font-size:19px;flex-shrink:0}
.s-cancel{width:100%;padding:15px;background:var(--surface2);border:none;border-radius:15px;
  font-size:16.5px;font-weight:650;color:var(--text);cursor:pointer;margin-top:10px;transition:opacity .15s}
.s-cancel:active{opacity:.6}

/* ---------------- полноэкранные страницы ---------------- */
.page{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease);visibility:hidden;
  padding-top:var(--safe-top)}
.page.on{transform:none;visibility:visible}
.page-bar{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;flex-shrink:0}
.page-title{font-size:17px;font-weight:750;flex:1;text-align:center;padding-right:40px}
.page-title.left{text-align:left;padding-right:0;padding-left:4px}
.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 26px)}
.page-foot{flex-shrink:0;padding:10px 16px calc(var(--safe-bottom) + 12px);background:linear-gradient(to top,var(--bg) 62%,transparent)}
.back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;
  color:var(--accent);cursor:pointer;border-radius:50%;transition:background .2s,transform .15s;flex-shrink:0}
.back-btn:active{background:var(--surface2);transform:scale(.9)}
.back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page-sub{font-size:13px;color:var(--text3);text-align:center;padding:0 20px 14px}
.sec-h{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;padding:16px 20px 8px}

/* ---------------- график ---------------- */
.ch-live{padding:2px 20px 6px}
.ch-lab{font-size:11px;font-weight:650;color:var(--text3);letter-spacing:.9px;text-transform:uppercase;display:block;margin-bottom:3px}
.ch-num{display:flex;align-items:baseline;line-height:1}
.ch-int{font-size:50px;font-weight:800;letter-spacing:-2.4px}
.ch-dot{font-size:38px;font-weight:800}
.ch-dec{font-size:25px;font-weight:700;opacity:.65}
.ch-pct{font-size:21px;font-weight:650;opacity:.4;margin-left:4px}
.ch-mot{font-size:13px;color:var(--text2);margin-top:7px;line-height:1.45;min-height:19px}
.ch-range{display:flex;gap:4px;padding:8px 10px;justify-content:center;flex-wrap:nowrap}
.rb{background:rgba(255,255,255,.07);border:none;border-radius:19px;padding:6px 10px;font-size:12px;font-weight:650;white-space:nowrap;
  color:var(--text2);cursor:pointer;transition:background .2s,color .2s,transform .15s}
.rb.on{background:rgba(255,255,255,.19);color:#fff}
.rb:active{transform:scale(.94)}
.ch-wrap{flex:1;min-height:170px;position:relative;touch-action:none;margin:0 6px}
.ch-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ch-info{padding:6px 20px 4px;font-size:11.5px;color:var(--text3);text-align:center;cursor:pointer;user-select:none;flex-shrink:0}
.ch-arrow{display:inline-block;transition:transform .28s var(--ease)}
.ch-body{max-height:0;overflow:hidden;transition:max-height .4s var(--ease),opacity .3s;opacity:0;
  font-size:13px;color:var(--text2);line-height:1.6;padding:0 24px;flex-shrink:0}
.ch-body.on{max-height:340px;opacity:1;padding:6px 24px 12px;overflow-y:auto}

/* ---------------- лента фаз ---------------- */
.tl{padding:0 20px 20px}
.tl-i{display:flex}
.tl-l{display:flex;flex-direction:column;align-items:center;width:30px;flex-shrink:0}
.tl-v{width:2px;background:rgba(255,255,255,.16);flex:1;min-height:8px;border-radius:1px}
.tl-d{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin:3px 0;transition:all .3s}
.tl-d.done{background:rgba(255,255,255,.28)}
.tl-d.now{width:15px;height:15px;margin:0;animation:haloPulse 2.8s ease-in-out infinite}
.tl-d.next{background:transparent;border:2px solid rgba(255,255,255,.14)}
.tl-r{flex:1;padding:0 0 22px 8px;min-width:0}
.tl-i:last-child .tl-r{padding-bottom:6px}
.tl-head{display:flex;align-items:center;gap:8px}

<script>
"use strict";
/* ============================================================
   askeza 2.0
   Приложение для отказа от привычек. Один файл, без зависимостей.
   ============================================================ */

const VERSION='2.1';
const KEY='askeza2_data';
const KEY_BACKUP='askeza2_backup';
const KEY_V1='askeza_data';       // старое приложение — только чтение, никогда не пишем

/* ------------------------------------------------------------
   Утилиты
   ------------------------------------------------------------ */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-t,3);

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** Русская плюрализация: plural(21,'день','дня','дней') -> 'день' */
function plural(n,one,few,many){
  const a=Math.abs(Math.floor(n)),d=a%10,h=a%100;
  if(d===1&&h!==11)return one;
  if(d>=2&&d<=4&&(h<12||h>14))return few;
  return many;
}
const nDays=n=>n+' '+plural(n,'день','дня','дней');

/** Локальная дата в формате YYYY-MM-DD. Никогда не через toISOString —
    он возвращает UTC и сдвигает дату у всех восточнее Гринвича. */
const localDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const localTime=d=>pad(d.getHours())+':'+pad(d.getMinutes());

const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtDate(x){const d=new Date(x);return d.getDate()+' '+MONTHS_SHORT[d.getMonth()]+' '+d.getFullYear()}
function fmtDateTime(x){const d=new Date(x);return fmtDate(d)+', '+localTime(d)}
function fmtLong(x){const d=new Date(x);return d.getDate()+' '+MONTHS[d.getMonth()]}

/** Календарная разбивка с заимствованием — настоящие месяцы, а не «30 дней». */
function breakdown(from,to){
  const a=new Date(from),b=new Date(to);
  let s=b.getSeconds()-a.getSeconds(), mi=b.getMinutes()-a.getMinutes(), h=b.getHours()-a.getHours();
  let d=b.getDate()-a.getDate(), mo=b.getMonth()-a.getMonth(), y=b.getFullYear()-a.getFullYear();
  if(s<0){s+=60;mi--}
  if(mi<0){mi+=60;h--}
  if(h<0){h+=24;d--}
  if(d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();mo--}
  if(mo<0){mo+=12;y--}
  return {y,mo,d,h,mi,s};
}
const daysInMonthBefore=t=>{const b=new Date(t);return new Date(b.getFullYear(),b.getMonth(),0).getDate()};

function fmtLeft(sec){
  if(sec<=0)return'—';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);
  if(d>0)return d+' '+plural(d,'день','дня','дней')+' '+pad(h)+':'+pad(m)+':'+pad(s);
  return pad(h)+':'+pad(m)+':'+pad(s);
}
function fmtRough(sec){
  if(sec<60)return'меньше минуты';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d>=365){const y=Math.floor(d/365),r=Math.floor((d%365)/30);return y+' '+plural(y,'год','года','лет')+(r?' '+r+' мес':'')}
  if(d>=60){const mo=Math.floor(d/30);return mo+' '+plural(mo,'месяц','месяца','месяцев')}
  if(d>0)return nDays(d)+(h?' '+h+' '+plural(h,'час','часа','часов'):'');
  if(h>0)return h+' '+plural(h,'час','часа','часов');
  return m+' '+plural(m,'минута','минуты','минут');
}

/* ------------------------------------------------------------
   Справочные данные
   ------------------------------------------------------------ */
const KINDS={
  smoking:{title:'Курение',   emoji:'🚭',color:'#ff453a'},
  alcohol:{title:'Алкоголь',  emoji:'🍷',color:'#ff9f0a'},
  weed:   {title:'Марихуана', emoji:'🌿',color:'#4cd964'},
  scroll: {title:'Скроллинг', emoji:'📱',color:'#5e9eff'},
  porn:   {title:'Порно',     emoji:'🔞',color:'#c46bd8'},
  sleep:  {title:'Режим сна', emoji:'🌙',color:'#7c8cff',mode:'daily'},
  custom: {title:'Своя',      emoji:'✏️',color:'#2aabee'},
};
/* Два архетипа привычки:
   abstain — непрерывный отсчёт с момента отказа, обрывается срывом;
   daily   — серия дней, каждый день нужно закрыть отметкой.
   Аскезы, вехи, история и срывы общие, различается только продвижение серии. */
const isDaily=h=>!!(h&&KINDS[h.kind]&&KINDS[h.kind].mode==='daily');
const DAILY_MS=[
  {key:'d1',days:1,label:'Первое утро'},
  {key:'d3',days:3,label:'3 дня подряд'},
  {key:'w1',days:7,label:'Неделя'},
  {key:'w2',days:14,label:'2 недели'},
  {key:'w3',days:21,label:'3 недели'},
  {key:'mo1',days:30,label:'Месяц'},
  {key:'d45',days:45,label:'45 дней'},
  {key:'mo2',days:60,label:'2 месяца'},
  {key:'mo3',days:90,label:'3 месяца'},
  {key:'mo6',days:180,label:'Полгода'},
  {key:'y1',days:365,label:'Год'},
];
const PALETTE=['#2aabee','#ff453a','#ff9f0a','#30d158','#bf5af2','#ff375f','#64d2ff','#ffd60a'];

/* Сила тяги в % от пика по дням воздержания. Это опорные точки из исследований,
   а не подогнанная формула: кривая обязана проходить через них. */
const CRAVING={
  smoking:[[0,100],[1,97],[3,92],[7,72],[14,48],[30,30],[90,18],[180,12],[365,8],[730,6],[1825,4],[3650,3]],
  alcohol:[[0,100],[3,97],[7,88],[14,76],[30,62],[90,42],[180,30],[365,20],[730,12],[1825,4],[3650,3]],
  weed:   [[0,100],[3,100],[7,85],[14,63],[30,43],[90,27],[180,17],[365,10],[730,6],[1825,3],[3650,2]],
};

/* Монотонная кубическая интерполяция (PCHIP) в лог-пространстве дней:
   проходит через точки, гладкая, никогда не растёт обратно. */
function buildCurve(anchors){
  const xs=anchors.map(a=>Math.log10(1+a[0])),ys=anchors.map(a=>a[1]),n=xs.length,h=[],d=[];
  for(let i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(ys[i+1]-ys[i])/h[i]}
  const m=new Array(n);m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0)m[i]=0;
    else{const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}
  }
  return function(sec){
    const x=Math.log10(1+Math.max(0,sec/86400));
    if(x<=xs[0])return ys[0];
    if(x>=xs[n-1])return ys[n-1];
    let i=0;while(i<n-1&&x>xs[i+1])i++;
    const t=(x-xs[i])/h[i],t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h[i]*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h[i]*m[i+1];
  };
}
const CURVES={smoking:buildCurve(CRAVING.smoking),alcohol:buildCurve(CRAVING.alcohol),weed:buildCurve(CRAVING.weed)};
const hasCurve=k=>!!CURVES[k];
const craving=(k,sec)=>CURVES[k]?CURVES[k](sec):0;

/** Знаков после запятой — по фактической скорости изменения кривой. */
function cravingDigits(k,sec){
  const f=CURVES[k];if(!f)return 2;
  const spd=Math.abs(f(sec+0.5)-f(sec-0.5))*0.1;
  if(spd<=0)return 8;
  return clamp(Math.ceil(-Math.log10(spd))+1,2,8);
}

const ZONES=[
  {min:90,label:'Пик тяги',        color:'#ff453a'},
  {min:75,label:'Острая отмена',   color:'#ff6a30'},
  {min:50,label:'Тяга убывает',    color:'#ff9f0a'},
  {min:25,label:'Становится легче',color:'#ffd60a'},
  {min:10,label:'Тяга слабеет',    color:'#a8d84a'},
  {min:-1,label:'Минимальная тяга',color:'#30d158'},
];
const zoneOf=v=>ZONES.find(z=>v>z.min)||ZONES[ZONES.length-1];
const zoneBg=z=>z.color+'1f';

const TIERS={
  bronze:{name:'Бронза', color:'var(--bronze)',raw:'#cd7f32'},
  silver:{name:'Серебро',color:'var(--silver)',raw:'#b6b6be'},
  gold:  {name:'Золото', color:'var(--gold)',  raw:'#ffd60a'},
  plat:  {name:'Платина',color:'var(--plat)',  raw:'#c4a7ff'},
};

const D=86400;
const PHASES={
  smoking:[
    {from:0,     to:3*D,     rank:'VIII',tier:'bronze',name:'Острая отмена',       desc:'Никотин выводится из крови за 72 часа. Тело требует дозу каждый час. Самый трудный момент — уже позади или прямо сейчас.'},
    {from:3*D,   to:7*D,     rank:'VII', tier:'bronze',name:'Пик ломки',            desc:'Никотин ушёл полностью, но рецепторы ещё сигналят. Раздражительность, тревога, нарушения сна — норма. Это пройдёт.'},
    {from:7*D,   to:30*D,    rank:'VI',  tier:'bronze',name:'Тело перестраивается', desc:'Физическая зависимость слабеет. Кашель — знак того, что лёгкие начали очищаться. Обоняние и вкус возвращаются.'},
    {from:30*D,  to:90*D,    rank:'V',   tier:'silver',name:'Сила привычки',        desc:'Тело свободно, но мозг ещё ищет старый ритуал. Кофе, стресс, скука — главные триггеры. Ты уже знаешь их в лицо.'},
    {from:90*D,  to:180*D,   rank:'IV',  tier:'silver',name:'Триггеры слабеют',     desc:'Ситуативные желания становятся реже и слабее. Ты учишься проходить мимо. Мозг строит новые реакции.'},

function blank(){return{v:2,habits:[],activeId:null,quoteIdx:Math.floor(Math.random()*QUOTES.length)}}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.habits))return normalize(d)}
  }catch(e){console.warn('основное хранилище не прочиталось',e)}
  try{
    const raw=localStorage.getItem(KEY_BACKUP);
    if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.habits)){toast('Данные восстановлены из копии');return normalize(d)}}
  }catch(e){}
  return blank();
}
function normalize(d){
  d.v=2;
  d.quoteIdx=d.quoteIdx||0;
  d.habits=(d.habits||[]).filter(h=>h&&h.id).map(h=>({
    id:h.id,
    name:String(h.name||'Привычка'),
    kind:KINDS[h.kind]?h.kind:'custom',
    color:h.color||'#2aabee',
    startedAt:h.startedAt||new Date().toISOString(),
    vow:h.vow&&h.vow.status==='active'?h.vow:null,
    history:Array.isArray(h.history)?h.history:[],
    sid:h.sid||1,
    daily:(KINDS[h.kind]&&KINDS[h.kind].mode==='daily')
      ? {wakeBy:(h.daily&&h.daily.wakeBy)||'07:00',checks:(h.daily&&h.daily.checks)||{}}
      : undefined,
  }));
  if(!d.habits.find(h=>h.id===d.activeId))d.activeId=d.habits.length?d.habits[0].id:null;
  return d;
}

/* Тип привычки определяется ОДИН раз при переносе из v1, дальше хранится полем. */
function guessKind(name){
  const n=String(name||'').toLowerCase();
  if(/безалкогол|б\/алког/.test(n))return'custom';
  if(/курен|сигарет|табак|никотин|вейп|куриц/.test(n))return'smoking';
  if(/алкогол|выпив|пить|бухл|спиртн|пиво|вино|водк/.test(n))return'alcohol';
  if(/марихуан|конопл|каннабис|травк|шишк|гашиш/.test(n))return'weed';
  return'custom';
}
function v1Available(){
  try{const r=localStorage.getItem(KEY_V1);if(!r)return 0;const d=JSON.parse(r);return d&&d.habits?d.habits.length:0}catch(e){return 0}
}
function importFromV1(){
  let d;try{d=JSON.parse(localStorage.getItem(KEY_V1))}catch(e){return 0}
  if(!d||!Array.isArray(d.habits))return 0;
  let n=0;
  d.habits.forEach(h=>{
    if(!h||!h.quitDate)return;
    const kind=guessKind(h.name);
    const nh=mkHabit({name:h.name||'Привычка',kind,color:h.color||KINDS[kind].color,startedAt:h.quitDate});
    (h.oldTokens||[]).forEach(t=>{
      if(t&&t.label)nh.history.push({t:'legacy',at:nh.startedAt,label:String(t.label),note:t.date?String(t.date):''});
    });
    seedMilestones(nh);          // прошлые вехи помечаем увиденными, без праздников
    S.habits.push(nh);n++;
  });
  if(n&&!S.activeId)S.activeId=S.habits[0].id;
  save();return n;
}

function mkHabit(o){
  return{
    id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    name:o.name,kind:o.kind,color:o.color,
    startedAt:o.startedAt,
    vow:null,
    sid:1,
    daily:(KINDS[o.kind]&&KINDS[o.kind].mode==='daily')?{wakeBy:o.wakeBy||'07:00',checks:{}}:undefined,
    history:[{t:'start',at:o.startedAt}],
  };
}
/** Помечает все уже пройденные вехи как увиденные — чтобы не сыпать праздниками при переносе. */
function seedMilestones(h){
  if(isDaily(h))return;                       // у режима серия начинается с первой отметки
  const sec=(Date.now()-new Date(h.startedAt).getTime())/1000;
  MILESTONES.forEach(m=>{
    if(sec>=m.sec)h.history.push({t:'milestone',at:new Date(new Date(h.startedAt).getTime()+m.sec*1000).toISOString(),key:m.key,sid:h.sid||1,seen:true});
  });
}

function shiftDay(key,n){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
const checksOf=h=>(h&&h.daily&&h.daily.checks)||{};
const wakeBy=h=>(h&&h.daily&&h.daily.wakeBy)||'07:00';

/** Серия = дни подряд с отметкой «вовремя», считая назад от сегодня.
    Незакрытый сегодняшний день серию не обрывает — он ещё идёт. */
function streakInfo(h){
  const c=checksOf(h),t=today(),mark=c[t]||null;
  if(mark&&!mark.ok)return{days:0,startDay:null,mark};
  let cur=mark?t:shiftDay(t,-1),days=0,startDay=null;
  while(c[cur]&&c[cur].ok){days++;startDay=cur;cur=shiftDay(cur,-1)}
  return{days,startDay,mark};
}
/** Незакрытые прошедшие дни, которые ещё можно отметить задним числом. */
function openDays(h,back){
  const c=checksOf(h),out=[],from=dayKey(new Date(h.startedAt));
  for(let i=1;i<=(back||3);i++){
    const k=shiftDay(today(),-i);
    if(k<from)break;
    if(!c[k])out.push(k);
  }
  return out;
}
const streakDays=h=>isDaily(h)?streakInfo(h).days:Math.floor(elapsed(h)/D);
const msList=h=>isDaily(h)?DAILY_MS:MILESTONES;
function msLabel(h,key){const m=msList(h).find(x=>x.key===key);return m?m.label:'Веха'}

function vowInfo(h){
  if(!h||!h.vow)return null;
  if(isDaily(h)){
    const total=Math.max(1,h.vow.days),done=clamp(streakInfo(h).days,0,total);
    return{daily:true,days:total,doneDays:done,leftDays:total-done,p:done/total,complete:done>=total};
  }
  const a=new Date(h.vow.startedAt).getTime(),b=new Date(h.vow.endsAt).getTime(),now=Date.now();
  const total=Math.max(1,(b-a)/1000),done=clamp((now-a)/1000,0,total);
  return{daily:false,days:h.vow.days,total,done,left:Math.max(0,(b-now)/1000),p:done/total,doneDays:Math.floor(done/D),complete:now>=b};
}
function kindOf(h){return(h&&KINDS[h.kind])?KINDS[h.kind]:KINDS.custom}
function habitColor(h){return(h&&h.color)?h.color:kindOf(h).color}
function phaseColorOf(h){
  if(!h)return'#2aabee';
  const p=phaseAt(h.kind,elapsed(h));
  if(p)return TIERS[p.tier].raw;
  return habitColor(h);
}

function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2600);
}

let R={};                       // ссылки на живые узлы главного экрана

function renderTop(){
  const h=active();
  $('topbar').innerHTML=
    `<div class="brand"><h1>askeza</h1><span class="ver">v${VERSION}</span></div>
     <div class="tb-actions">
       ${h?`<button class="icon-btn" data-act="habitMenu" aria-label="Действия с привычкой">${ICO.dots}</button>`:''}
       <button class="icon-btn" data-act="toggleMenu" aria-label="Список привычек">${ICO.menu}</button>
     </div>`;
}

function renderHome(animate){
  const h=active();
  const el=$('home');
  if(!h){
    el.className='';
    el.innerHTML=`<div class="empty">
      <div class="empty-ico">🔥</div>
      <h2>Начни свой путь</h2>
      <p>Добавь привычку, от которой хочешь отказаться, — и увидишь, как время работает на тебя.</p>
      <button class="btn inline" data-act="add">Добавить привычку</button>
      ${v1Available()?`<button class="btn ghost inline" style="margin-top:12px" data-act="importV1">Перенести из askeza 1</button>`:''}
    </div>`;
    R={};setGlow('#2aabee');renderTop();return;
  }
  el.className=animate?'stagger':'';
  el.innerHTML = isDaily(h) ? dailyHome(h) : abstainHome(h);

  R={
    big:$('big'),ring:$('ring'),vowLeft:$('vow-left'),
    cv:$('cv'),cvZone:$('cv-zone'),
    daily:isDaily(h),
    shownKeys:isDaily(h)?'daily':shownKeysNow(h),
    day:today(),
    bars:{},last:{},
  };
  if(!isDaily(h)){
    el.querySelectorAll('.obar').forEach(node=>{
      const k=node.dataset.u;
      R.bars[k]={fill:node.querySelector('.obar-fill'),n:node.querySelector('.obar-n'),
                 l:node.querySelector('.obar-l'),max:+node.dataset.max,labels:node.dataset.l.split('|')};
    });
    updateCraving(true);
    updateOdometer(true);
  }

  setGlow(phaseColorOf(h));
  renderTop();

  const vi=vowInfo(h);
  // узел кольца держим локально: экран может перерисоваться между кадрами,
  // и тогда R.ring уже указывает на другой элемент или на null
  const ringNode=R.ring;
  if(ringNode&&vi){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(!ringNode.isConnected)return;
      ringNode.style.strokeDashoffset=(ringLen*(1-vi.p)).toFixed(1);
      setTimeout(()=>{if(ringNode.isConnected)ringNode.classList.add('live')},1250);
    }));
  }
  if(animate)countUp(R.big,vi?vi.doneDays:streakDays(h));
}

/** Кольцо аскезы — общий герой обоих архетипов. */
function heroRing(h,unitWord){
  const col=habitColor(h),vi=vowInfo(h);
  const RAD=98,CIRC=2*Math.PI*RAD;ringLen=CIRC;
  const n=vi?vi.doneDays:streakDays(h);
  let below;
  if(vi){
    below=isDaily(h)
      ? `<div class="hero-left">осталось <b>${nDays(vi.leftDays)}</b> подряд</div>`
      : `<div class="hero-left">осталось <b class="num" id="vow-left">${fmtLeft(vi.left)}</b></div>`;
  }else{
    below=`<button class="vow-cta" data-act="vow">${ICO.bolt}Дать обет</button>`;
  }
  return `<div class="hero">
    <div class="ring-wrap" data-act="vow" role="button" aria-label="${vi?'Аскеза':'Дать обет'}">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${col}"/><stop offset="100%" stop-color="${col}" stop-opacity=".45"/>
        </linearGradient></defs>
        <circle class="ring-track${vi?'':' dashed'}" cx="110" cy="110" r="${RAD}"/>
        ${vi?`<circle class="ring-fill" id="ring" cx="110" cy="110" r="${RAD}" stroke="url(#rg)"
               stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>`:''}
      </svg>
      <div class="ring-center">
        <div class="ring-big num" id="big">${n}</div>
        <div class="ring-unit">${plural(n,'день','дня','дней')}${unitWord?' '+unitWord:''}</div>
        ${vi?`<div class="ring-of num">из ${vi.days}</div>`:''}
      </div>
    </div>
    ${below}
  </div>`;
}

/* ---------- архетип «отказ» ---------- */
function abstainHome(h){
  const sec=elapsed(h),b=breakdown(h.startedAt,Date.now());
  const has=hasCurve(h.kind),ph=phaseAt(h.kind,sec);
  const units=[
    {k:'y', v:b.y, max:Math.max(10,Math.ceil((b.y+1)/5)*5), l:['год','года','лет'],           c:['#ff3b30','#c1121f']},
    {k:'mo',v:b.mo,max:12,                                  l:['месяц','месяца','месяцев'],  c:['#ff9f0a','#c76a00']},
    {k:'d', v:b.d, max:daysInMonthBefore(Date.now()),       l:['день','дня','дней'],         c:['#30a8e0','#0f6ea6']},
    {k:'h', v:b.h, max:24,                                  l:['час','часа','часов'],        c:['#5b5bd6','#3a3a9e']},
    {k:'mi',v:b.mi,max:60,                                  l:['минута','минуты','минут'],   c:['#8a6fa8','#5d4a74']},
    {k:'s', v:b.s, max:60,                                  l:['секунда','секунды','секунд'],c:['#9a9aa2','#6b6b72']},
  ].filter((u,i)=>u.v>0||i>=3);

  return `<div class="h-head">
      <div class="h-name">${esc(h.name)}</div>
      <div class="h-since">свободен с ${fmtDateTime(h.startedAt)}</div>
    </div>
    ${heroRing(h,'')}
    ${has?`<div class="card craving" data-act="chart" role="button">
      <div class="craving-top"><span class="craving-label">Тяга</span>${ICO.chev}</div>
      <div class="craving-main">
        <div class="craving-num num" id="cv"></div>
        <div class="zone" id="cv-zone"></div>
      </div>
    </div>`:''}
    <div class="odo" id="odo">
      ${units.map(u=>`<div class="obar" data-u="${u.k}" data-max="${u.max}" data-l="${u.l.join('|')}">
        <div class="obar-fill" style="width:${clamp(u.v/u.max*100,0,100)}%;background:linear-gradient(90deg,${u.c[0]},${u.c[1]})"></div>
        <div class="obar-txt"><span class="obar-n num">${u.v}</span><span class="obar-l">${plural(u.v,u.l[0],u.l[1],u.l[2])}</span></div>
      </div>`).join('')}
    </div>
    ${ph?`<div class="card" data-act="phases" role="button"><div class="row">
      <div class="phase-rank" style="color:${TIERS[ph.tier].color}">${ph.rank}</div>
      <div class="row-body">

        <div class="phase-desc">${esc(ph.desc)}</div>
      </div>${ICO.chev}

}

/* ---------- архетип «режим» ---------- */
function dailyHome(h){
  const col=habitColor(h),target=wakeBy(h);
  const st=streakInfo(h),mark=st.mark;
  const open=openDays(h,3);
  const stats=dailyStats(h);

  let checkin;
  if(mark){
    const ok=mark.ok;
    checkin=`<div class="checkin"><div class="ci-done">
      <div class="ci-ico" style="background:${ok?'rgba(48,209,88,.16)':'rgba(255,69,58,.16)'};color:${ok?'#30d158':'#ff6a60'}">${ok?'✓':'✕'}</div>
      <div><div class="ci-t">${ok?'Встал вовремя':'Проспал'}</div>
        <div class="ci-s">Сегодня${mark.at?' в '+mark.at:''} · цель ${target}</div></div>
      <div class="ci-edit" data-act="redoToday" role="button">Изменить</div>
    </div></div>`;
  }else{
    checkin=`<div class="checkin">
      <button class="ci-btn" data-act="wake" style="background:${col}">☀️ Я проснулся</button>
      <div class="ci-s" style="text-align:center;margin-top:9px">Отметь подъём — время запишется само. Цель: до ${target}</div>
    </div>`;
  }

  const ask=open.length?`<div class="ask">
    <div class="ask-t">${open.length===1?'Один день не отмечен':nDays(open.length)+' не отмечено'}</div>
    <div class="ask-s">${fmtDayName(open[0])} — встал вовремя, до ${target}?</div>
    <div class="ask-b">
      <button class="ask-yes" data-act="backfill" data-arg="${open[0]}|1">Да</button>
      <button class="ask-no" data-act="backfill" data-arg="${open[0]}|0">Нет</button>
    </div></div>`:'';

  const cells=calendarCells(h);
  const dows=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

  return `<div class="h-head">
      <div class="h-name">${esc(h.name)}</div>
      <div class="h-since">подъём до ${target} · с ${fmtDate(h.startedAt)}</div>
    </div>
    ${heroRing(h,'подряд')}
    ${ask}
    ${checkin}
    <div class="cal-h">${dows.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal">${cells.map(c=>
      `<div class="cal-d ${c.st}${c.isToday?' today':''}">${c.n}</div>`).join('')}</div>
    <div class="dstat">
      <div class="hs"><div class="hs-n num" style="color:${col}">${stats.ok}</div><div class="hs-l">ВОВРЕМЯ</div></div>
      <div class="hs"><div class="hs-n num">${stats.miss}</div><div class="hs-l">ПРОСПАЛ</div></div>
      <div class="hs"><div class="hs-n num">${stats.avg||'—'}</div><div class="hs-l">В СРЕДНЕМ</div></div>
    </div>
    ${historyCard(h)}
    ${quoteBlock()}`;
}

function fmtDayName(key){
  const t=today();
  if(key===shiftDay(t,-1))return'Вчера';
  if(key===shiftDay(t,-2))return'Позавчера';
  const d=new Date(key+'T12:00:00');
  return d.getDate()+' '+MONTHS_SHORT[d.getMonth()];
}
/** Пять недель, понедельник первым. */
function calendarCells(h){
  const c=checksOf(h),t=new Date();
  const monday=new Date(t);monday.setDate(t.getDate()-((t.getDay()+6)%7));
  const start=new Date(monday);start.setDate(monday.getDate()-28);
  const from=dayKey(new Date(h.startedAt)),tk=today(),out=[];
  for(let i=0;i<35;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=localDate(d);
    let st='out';
    if(k<=tk&&k>=from)st=c[k]?(c[k].ok?'ok':'miss'):'none';
    out.push({k,st,n:d.getDate(),isToday:k===tk});
  }
  return out;
}
function dailyStats(h){
  const c=checksOf(h),keys=Object.keys(c);
  const ok=keys.filter(k=>c[k].ok).length;
  const mins=keys.filter(k=>c[k].at).map(k=>{const[a,b]=c[k].at.split(':');return +a*60+ +b});
  const avg=mins.length?pad(Math.floor(mins.reduce((x,y)=>x+y,0)/mins.length/60))+':'+pad(Math.round(mins.reduce((x,y)=>x+y,0)/mins.length)%60):null;
  return{ok,miss:keys.length-ok,total:keys.length,avg};
}

function historySummary(h){
  const rel=h.history.filter(e=>e.t==='relapse').length;
  const vows=h.history.filter(e=>e.t==='vow_done').length;
  const ms=h.history.filter(e=>e.t==='milestone').length;
  const parts=[];
  if(vows)parts.push(vows+' '+plural(vows,'обет','обета','обетов'));
  if(ms)parts.push(ms+' '+plural(ms,'веха','вехи','вех'));
  if(rel)parts.push(rel+' '+plural(rel,'срыв','срыва','срывов'));
  return parts.length?parts.join(' · '):'Пока пусто — всё впереди';
}

let counting=false;
function countUp(node,target){
  if(!node||target<=0||prefersReduced())return;
  const dur=700,t0=performance.now();
  counting=true;
  (function step(t){
    const k=clamp((t-t0)/dur,0,1);
    node.textContent=Math.round(easeOut(k)*target);
    if(k<1)requestAnimationFrame(step);
    else{node.textContent=target;counting=false}
  })(t0);
}
/** Набор видимых полос одометра меняется, когда набегает новая единица
    (первый день, первый месяц). Тогда главный экран надо пересобрать. */
function shownKeysNow(h){
  const b=breakdown(h.startedAt,Date.now());
  const v=[b.y,b.mo,b.d,b.h,b.mi,b.s],k=['y','mo','d','h','mi','s'];
  return k.filter((_,i)=>v[i]>0||i>=3).join(',');
}
const prefersReduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setGlow(color){$('glow').style.color=color}

/* ------------------------------------------------------------
   Живое обновление
   ------------------------------------------------------------ */
function updateCraving(force){
  const h=active();if(!h||!R.cv||!hasCurve(h.kind))return;
  const sec=elapsed(h),v=craving(h.kind,sec),dig=cravingDigits(h.kind,sec);
  const str=v.toFixed(dig),i=str.indexOf('.');
  const z=zoneOf(v);
  if(force||R.last.cv!==str){
    R.last.cv=str;
    R.cv.innerHTML=`<span class="cv-int" style="color:${z.color}">${str.slice(0,i)}</span><span class="cv-dot" style="color:${z.color}">.</span><span class="cv-dec">${str.slice(i+1)}</span><span class="cv-pct">%</span>`;
  }
  if(force||R.last.zone!==z.label){
    R.last.zone=z.label;
    R.cvZone.textContent=z.label;
    R.cvZone.style.color=z.color;
    R.cvZone.style.background=zoneBg(z);
  }
}

function updateOdometer(force){
  const h=active();if(!h||!R.bars)return;
  const now=Date.now(),b=breakdown(h.startedAt,now);
  const vals={y:b.y,mo:b.mo,d:b.d,h:b.h,mi:b.mi,s:b.s};
  for(const k in R.bars){
    const r=R.bars[k],v=vals[k];
    if(v===undefined)continue;
    if(force||R.last['o'+k]!==v){
      R.last['o'+k]=v;
      r.n.textContent=v;
      r.l.textContent=plural(v,r.labels[0],r.labels[1],r.labels[2]);
      if(k!=='s')r.fill.style.width=clamp(v/r.max*100,0,100)+'%';
    }
  }
  // секундная полоса течёт непрерывно, а не прыгает раз в секунду
  const s=R.bars.s;
  if(s){
    const ms=(now-new Date(h.startedAt).getTime())/1000%60;
    s.fill.style.width=clamp(ms/60*100,0,100)+'%';
  }
}

function tickSecond(){
  const h=active();if(!h)return;
  if(R.daily){                                  // серия растёт отметками, а не секундами
    if(R.day&&R.day!==today()){renderHome(false);return}
    checkProgress();return;
  }
  if(R.shownKeys&&shownKeysNow(h)!==R.shownKeys){renderHome(false);return}
  updateOdometer(false);
  const vi=vowInfo(h);
  if(vi){
    if(R.vowLeft)R.vowLeft.textContent=fmtLeft(vi.left);
    if(R.ring)R.ring.style.strokeDashoffset=(ringLen*(1-vi.p)).toFixed(1);
    if(R.big&&!counting)R.big.textContent=vi.doneDays;
  }else if(R.big&&!counting){
    R.big.textContent=Math.floor(elapsed(h)/D);
  }
  checkProgress();
}

let lastSec=0,lastCv=0,running=true;
function loop(t){
  if(running){
    const now=Date.now();
    if(now-lastCv>=100){lastCv=now;updateCraving(false)}
    const sec=Math.floor(now/1000);
    if(sec!==lastSec){lastSec=sec;tickSecond()}
    else updateOdometer(false);
  }
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------
   Вехи и завершение аскезы
   ------------------------------------------------------------ */
function checkProgress(){
  let dirty=false;
  S.habits.forEach(h=>{
    if(!h.sid)h.sid=1;
    // вехи считаются только для ТЕКУЩЕЙ серии, но прошлые остаются в истории:
    // срыв больше не стирает то, что было пройдено
    const seen=new Set(h.history.filter(e=>e.t==='milestone'&&(e.sid||1)===h.sid).map(e=>e.key));
    if(isDaily(h)){
      const st=streakInfo(h);
      const seenD=new Set(h.history.filter(e=>e.t==='milestone'&&e.from===st.startDay).map(e=>e.key));
      if(st.startDay)DAILY_MS.forEach(m=>{
        if(st.days>=m.days&&!seenD.has(m.key)){
          h.history.push({t:'milestone',at:new Date(shiftDay(st.startDay,m.days-1)+'T12:00:00').toISOString(),
                          key:m.key,from:st.startDay,seen:false});dirty=true;
        }
      });
      const vi=vowInfo(h);
      if(h.vow&&h.vow.status==='active'&&vi&&vi.complete){
        h.history.push({t:'vow_done',at:new Date().toISOString(),days:h.vow.days,from:h.vow.startedAt,seen:false});
        h.vow=null;dirty=true;
      }
    }else{
      const start=new Date(h.startedAt).getTime(),sec=(Date.now()-start)/1000;
      MILESTONES.forEach(m=>{
        if(sec>=m.sec&&!seen.has(m.key)){
          h.history.push({t:'milestone',at:new Date(start+m.sec*1000).toISOString(),key:m.key,sid:h.sid,seen:false});
          dirty=true;
        }
      });
      // аскеза: завершение определяется сравнением времени, а не поимкой момента
      if(h.vow&&h.vow.status==='active'&&Date.now()>=new Date(h.vow.endsAt).getTime()){
        h.history.push({t:'vow_done',at:h.vow.endsAt,days:h.vow.days,from:h.vow.startedAt,seen:false});
        h.vow=null;dirty=true;
      }
    }
  });
  if(dirty){save();queueCelebrations();if(active())renderHome(false)}
}

/* ------------------------------------------------------------
   Празднования
   ------------------------------------------------------------ */
let celQueue=[],celBusy=false;
function queueCelebrations(){
  S.habits.forEach(h=>{
    const fresh=h.history.filter(e=>e.seen===false&&(e.t==='milestone'||e.t==='vow_done'));
    if(!fresh.length)return;
    // Аскезы показываем все — их мало и каждая заслужена.
    fresh.filter(e=>e.t==='vow_done').forEach(e=>celQueue.push({h,e}));
    // Вехи схлопываем: вернулся через две недели — получаешь одно празднование
    // самой крупной вехи, а не шесть окон подряд.
    const L=msList(h);
    const ms=fresh.filter(e=>e.t==='milestone')
      .sort((a,b)=>L.findIndex(m=>m.key===a.key)-L.findIndex(m=>m.key===b.key));
    if(ms.length)celQueue.push({h,e:ms[ms.length-1]});
    fresh.forEach(e=>e.seen=true);
  });
  if(celQueue.length){save();showNextCelebration()}
}
function showNextCelebration(){
  if(celBusy||!celQueue.length)return;
  const {h,e}=celQueue.shift();celBusy=true;
  const col=habitColor(h);
  let kicker,title,sub,badge,acts;
  if(e.t==='vow_done'){
    kicker='Аскеза выполнена';
    title=nDays(e.days);
    sub=`${esc(h.name)} · ты обещал себе и сдержал слово.`;
    badge='✓';
    acts=`<button class="btn" data-act="celVowRepeat" data-id="${h.id}" data-days="${e.days}" data-at="${e.at}">Продлить на ${nDays(e.days)}</button>
          <button class="btn ghost" data-act="celVowNew" data-id="${h.id}">Новый срок</button>
          <button class="btn ghost" data-act="celClose">Оставить без срока</button>`;
  }else{
    kicker='Веха пройдена';
    title=msLabel(h,e.key);
    sub=`${esc(h.name)} · ${isDaily(h)?fmtDate(e.at):fmtDateTime(e.at)}`;
    badge='★';
    acts=`<button class="btn" data-act="celClose">Продолжаю</button>`;
  }
  $('cel').innerHTML=`
    <div class="cel-badge" style="background:${col}2e;color:#fff;border:1.5px solid ${col};box-shadow:0 0 42px ${col}55">${badge}</div>
    <div class="cel-kicker" style="color:${col}">${kicker}</div>
    <div class="cel-title">${title}</div>
    <div class="cel-sub">${sub}</div>
    <div class="cel-acts">${acts}</div>`;
  $('cel').classList.add('on');
}
function closeCelebration(){
  $('cel').classList.remove('on');celBusy=false;
  setTimeout(()=>{if(celQueue.length)showNextCelebration()},380);
}

/* ------------------------------------------------------------
   Отметка дня (режим)
   ------------------------------------------------------------ */
function markDay(h,key,timeStr,forceOk){
  if(!h.daily)h.daily={wakeBy:'07:00',checks:{}};
  const ok=(forceOk===undefined)?(!!timeStr&&timeStr<=wakeBy(h)):!!forceOk;
  h.daily.checks[key]={ok,at:timeStr||null};
  // переотметка того же дня заменяет запись, а не плодит дубли
  h.history=h.history.filter(e=>!((e.t==='wake'||e.t==='oversleep')&&e.day===key));
  h.history.push({t:ok?'wake':'oversleep',at:new Date(key+'T'+(timeStr||'09:00')+':00').toISOString(),
                  day:key,time:timeStr||null});
  save();renderHome(true);checkProgress();
  const late=timeStr&&!ok?' в '+timeStr:'';
  toast(ok?(timeStr?'Засчитано, '+timeStr:'Засчитано'):'Записано'+late+'. Завтра новый шанс');
}
function bestStreak(h){
  if(!isDaily(h))return Math.max(streakDays(h),...h.history.filter(e=>e.t==='relapse').map(e=>e.streakDays||0),0);
  const c=checksOf(h),keys=Object.keys(c).sort();
  let best=0,cur=0,prev=null;
  keys.forEach(k=>{
    if(c[k].ok)cur=(prev&&shiftDay(prev,1)===k)?cur+1:1;else cur=0;
    best=Math.max(best,cur);prev=k;
  });
  return best;
}

function drawVowPage(){

function formStart(){

}

  </div>`;
}

let chartRange=365,chartTouchDay=null,chartStaticKey='',pulseRAF=null,liveTimer=null;
function openChart(){
  const h=active();if(!h||!hasCurve(h.kind))return;
  const days=elapsed(h)/D;
  chartRange=days>1825?3650:days>365?1825:days>180?365:days>90?180:days>30?90:30;
  chartTouchDay=null;chartStaticKey='';
  const RANGES=[[30,'1 мес'],[90,'3 мес'],[180,'6 мес'],[365,'1 год'],[1825,'5 лет'],[3650,'10 лет']];
  openPage('p-chart',
    pageBar('','closeChart')+
    `<div class="ch-live">
      <span class="ch-lab">Тяга</span>
      <div class="ch-num num" id="ch-num"></div>
      <div class="ch-mot" id="ch-mot"></div>
    </div>
    <div class="ch-range">${RANGES.map(r=>
      `<button class="rb ${r[0]===chartRange?'on':''}" data-act="chRange" data-arg="${r[0]}">${r[1]}</button>`).join('')}</div>
    <div class="ch-wrap" id="ch-wrap"><canvas id="ch-static"></canvas><canvas id="ch-live"></canvas></div>
    <div class="ch-info" data-act="chInfo">Основано на научных данных <span class="ch-arrow" id="ch-arrow">›</span></div>
    <div class="ch-body" id="ch-body">${chartNote(h.kind)}</div>`);
  setupChartTouch();
  requestAnimationFrame(()=>{drawStatic(0);animateChart()});
  clearInterval(liveTimer);liveTimer=setInterval(updateChartNum,100);
  updateChartNum();
}
function closeChart(){
  closePage('p-chart');
  clearInterval(liveTimer);liveTimer=null;
  cancelAnimationFrame(pulseRAF);pulseRAF=null;
}
function updateChartNum(){
  const h=active();if(!h||!hasCurve(h.kind))return;
  const sec=elapsed(h),v=craving(h.kind,sec),dig=cravingDigits(h.kind,sec);
  const str=v.toFixed(dig),i=str.indexOf('.'),z=zoneOf(v);
  const n=$('ch-num');
  if(n)n.innerHTML=`<span class="ch-int" style="color:${z.color}">${str.slice(0,i)}</span><span class="ch-dot" style="color:${z.color}">.</span><span class="ch-dec">${str.slice(i+1)}</span><span class="ch-pct">%</span>`;
  const m=$('ch-mot');if(m)m.textContent=motive(v);
}
function chartMetrics(){
  const wrap=$('ch-wrap');if(!wrap)return null;
  const W=wrap.clientWidth||320,H=wrap.clientHeight||220;
  return{W,H,pad:{t:14,r:14,b:24,l:30},dpr:Math.min(devicePixelRatio||1,3)};
}
function prep(canvas,m){
  canvas.width=m.W*m.dpr;canvas.height=m.H*m.dpr;
  const ctx=canvas.getContext('2d');ctx.setTransform(m.dpr,0,0,m.dpr,0,0);
  ctx.clearRect(0,0,m.W,m.H);return ctx;
}
const Y_MAX=108;
function xPx(d,m){return m.pad.l+(d/chartRange)*(m.W-m.pad.l-m.pad.r)}
function yPx(v,m){const ch=m.H-m.pad.t-m.pad.b;return m.pad.t+ch-(clamp(v,0,Y_MAX)/Y_MAX)*ch}

/** Статический слой: сетка, заливка, кривая, подписи. Перерисовывается только при смене диапазона. */
function drawStatic(progress){
  const h=active(),m=chartMetrics();if(!h||!m)return;
  const ctx=prep($('ch-static'),m);
  const cw=m.W-m.pad.l-m.pad.r,ch=m.H-m.pad.t-m.pad.b;
  const f=CURVES[h.kind];if(!f)return;

  ctx.font='500 9px -apple-system,sans-serif';ctx.textAlign='right';
  [0,25,50,75,100].forEach(y=>{
    ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(m.pad.l,yPx(y,m));ctx.lineTo(m.pad.l+cw,yPx(y,m));ctx.stroke();
    ctx.fillStyle='rgba(154,154,160,.55)';ctx.fillText(y+'%',m.pad.l-5,yPx(y,m)+3);
  });
  const ticks=chartRange<=30?[[7,'1н'],[14,'2н'],[30,'1м']]
    :chartRange<=90?[[30,'1м'],[60,'2м'],[90,'3м']]
    :chartRange<=180?[[30,'1м'],[90,'3м'],[180,'6м']]
    :chartRange<=365?[[30,'1м'],[90,'3м'],[180,'6м'],[365,'1г']]
    :chartRange<=1825?[[365,'1г'],[730,'2г'],[1095,'3г'],[1825,'5л']]
    :[[365,'1г'],[1095,'3г'],[1825,'5л'],[2555,'7л'],[3650,'10л']];
  ctx.textAlign='center';
  ticks.forEach(t=>{
    if(t[0]>chartRange)return;
    ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(xPx(t[0],m),m.pad.t);ctx.lineTo(xPx(t[0],m),m.pad.t+ch);ctx.stroke();
    ctx.fillStyle='rgba(154,154,160,.55)';ctx.fillText(t[1],xPx(t[0],m),m.H-m.pad.b+13);
  });

  const STEPS=340,upTo=Math.floor(STEPS*clamp(progress,0,1));
  if(upTo<1)return;
  const pts=[];
  for(let i=0;i<=upTo;i++){const d=i/STEPS*chartRange;pts.push([xPx(d,m),yPx(f(d*D),m)])}

  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.lineTo(pts[pts.length-1][0],yPx(0,m));ctx.lineTo(pts[0][0],yPx(0,m));ctx.closePath();
  const g=ctx.createLinearGradient(0,m.pad.t,0,m.pad.t+ch);
  g.addColorStop(0,'rgba(255,69,58,.30)');g.addColorStop(.45,'rgba(255,159,10,.12)');g.addColorStop(1,'rgba(48,209,88,.02)');
  ctx.fillStyle=g;ctx.fill();

  const lg=ctx.createLinearGradient(m.pad.l,0,m.pad.l+cw,0);
  lg.addColorStop(0,'#ff453a');lg.addColorStop(.2,'#ff9f0a');lg.addColorStop(.45,'#ffd60a');lg.addColorStop(1,'#30d158');
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=lg;ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
}

/** Живой слой: только точка «ты здесь» и тултип. Дёшево рисовать каждый кадр. */
function drawLive(ts){
  const h=active(),m=chartMetrics();if(!h||!m)return;
  const f=CURVES[h.kind];if(!f)return;
  const ctx=prep($('ch-live'),m);
  const ch=m.H-m.pad.t-m.pad.b;
  const days=elapsed(h)/D;

  if(days<=chartRange){
    const v=f(days*D),cx=xPx(days,m),cy=yPx(v,m),z=zoneOf(v);
    const pulse=(Math.sin(ts/680)+1)/2,rr=9+pulse*7;
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
    rg.addColorStop(0,`rgba(255,255,255,${.13+pulse*.10})`);rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,rr,0,6.29);ctx.fill();
    ctx.fillStyle=z.color;ctx.beginPath();ctx.arc(cx,cy,5,0,6.29);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=1.6;ctx.stroke();
    if(chartTouchDay===null){
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='600 10px -apple-system,sans-serif';
      const right=days>chartRange*.7;ctx.textAlign=right?'right':'left';
      ctx.fillText('Ты здесь',cx+(right?-12:12),cy-11);
    }
  }
  if(chartTouchDay!==null){
    const d=chartTouchDay,v=f(d*D),tx=xPx(d,m),ty=yPx(v,m),z=zoneOf(v);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(tx,m.pad.t);ctx.lineTo(tx,m.pad.t+ch);ctx.stroke();ctx.setLineDash([]);
    const gg=ctx.createRadialGradient(tx,ty,0,tx,ty,16);
    gg.addColorStop(0,'rgba(255,255,255,.2)');gg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(tx,ty,16,0,6.29);ctx.fill();
    ctx.fillStyle=z.color;ctx.beginPath();ctx.arc(tx,ty,5.5,0,6.29);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=1.6;ctx.stroke();
    const lab=d<1?Math.round(d*24)+' ч':d<7?Math.round(d)+' '+plural(Math.round(d),'день','дня','дней')
      :d<30?Math.round(d/7)+' нед':d<365?(d/30).toFixed(1)+' мес':(d/365).toFixed(1)+' г';
    const bw=96,bh=52;
    let bx=tx+16;if(bx+bw>m.W-m.pad.r-2)bx=tx-bw-16;
    bx=clamp(bx,2,m.W-bw-2);
    const by=clamp(ty-bh/2,m.pad.t+2,m.pad.t+ch-bh-2);
    ctx.fillStyle='rgba(22,22,25,.97)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,13);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=z.color;ctx.font='700 18px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText(v.toFixed(1)+'%',bx+bw/2,by+22);
    ctx.fillStyle='rgba(154,154,160,.85)';ctx.font='500 11px -apple-system,sans-serif';
    ctx.fillText(lab,bx+bw/2,by+39);
  }
}
function animateChart(){
  cancelAnimationFrame(pulseRAF);
  const DUR=prefersReduced()?1:620,t0=performance.now();
  (function step(t){
    const k=clamp((t-t0)/DUR,0,1);
    if(k<1){drawStatic(easeOut(k));drawLive(t);pulseRAF=requestAnimationFrame(step)}
    else{drawStatic(1);pulseLoop()}
  })(t0);
}
function pulseLoop(){
  cancelAnimationFrame(pulseRAF);
  (function step(t){drawLive(t);pulseRAF=requestAnimationFrame(step)})(performance.now());
}
function setupChartTouch(){
  const c=$('ch-live'),wrap=$('ch-wrap');if(!c||!wrap)return;
  const dayAt=x=>{
    const r=wrap.getBoundingClientRect(),m=chartMetrics();
    return clamp((x-r.left-m.pad.l)/(r.width-m.pad.l-m.pad.r)*chartRange,0,chartRange);
  };
  let clear=null;
  const set=x=>{chartTouchDay=dayAt(x);clearTimeout(clear)};
  wrap.addEventListener('touchstart',e=>{e.preventDefault();set(e.touches[0].clientX)},{passive:false});
  wrap.addEventListener('touchmove',e=>{e.preventDefault();set(e.touches[0].clientX)},{passive:false});
  wrap.addEventListener('touchend',()=>{clearTimeout(clear);clear=setTimeout(()=>chartTouchDay=null,1800)});
  wrap.addEventListener('mousemove',e=>set(e.clientX));
  wrap.addEventListener('mouseleave',()=>chartTouchDay=null);
}

    <div class="stakes">

    <div class="sos-acts">

      <button class="btn ghost" data-act="sosClose">Закрыть</button>
    </div>`;
  $('sos').classList.add('on');
  sosCycle=0;runBreath();
}
function runBreath(){
  const c=$('br-c'),t=$('br-t'),n=$('br-n');
  if(!c)return;
  const steps=[['Вдох',4000,1.0],['Задержи',7000,1.0],['Выдох',8000,.55]];
  let i=0;
  clearTimeout(sosTimer);
  const go=()=>{
    if(!$('sos').classList.contains('on'))return;
    const [label,dur,scale]=steps[i];
    t.textContent=label;
    let left=Math.round(dur/1000);
    n.textContent=left;
    if(sosAnim)sosAnim.cancel();
    if(i!==1&&!prefersReduced()){
      sosAnim=c.animate([{transform:`scale(${i===0?.55:1})`},{transform:`scale(${scale})`}],
        {duration:dur,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'});
    }else{c.style.transform=`scale(${scale})`}
    const cd=setInterval(()=>{left--;if(left>=0&&n)n.textContent=left;if(left<=0)clearInterval(cd)},1000);
    sosTimer=setTimeout(()=>{clearInterval(cd);i=(i+1)%3;if(i===0)sosCycle++;go()},dur);
  };
  go();
}
function closeSOS(logIt){
  const h=active();
  if(logIt&&h){h.history.push({t:'urge',at:new Date().toISOString()});save();renderHome(false);toast('Записано. Ты справился')}
  $('sos').classList.remove('on');
  clearTimeout(sosTimer);if(sosAnim){sosAnim.cancel();sosAnim=null}
}

    const h=active();if(!h)return;
    const t=formStart(),name=form.name.trim();
    if(!name)return toast('Название не может быть пустым');
    if(!t)return toast('Проверь дату');
    if(t.getTime()>Date.now()+60000)return toast('Это время ещё не наступило');
    h.name=name;h.color=form.color;
    const wk=$('e-wake');
    if(isDaily(h)&&wk&&wk.value){
      if(!h.daily)h.daily={wakeBy:'07:00',checks:{}};
      h.daily.wakeBy=wk.value;
    }
    if(t.toISOString()!==h.startedAt){
      h.startedAt=t.toISOString();
      const st=h.history.find(e=>e.t==='start');if(st)st.at=h.startedAt;
      if(!isDaily(h)){
        // вехи текущей серии пересобираем под новую дату, прошлые серии не трогаем
        h.history=h.history.filter(e=>!(e.t==='milestone'&&(e.sid||1)===(h.sid||1)));
        seedMilestones(h);
        if(h.vow){h.vow.startedAt=h.startedAt;h.vow.endsAt=new Date(t.getTime()+h.vow.days*D*1000).toISOString()}
      }
    }
    save();closePage('p-add');renderHome(true);toast('Сохранено');
  },

  /* аскеза */
  vow(){closeSheet();openVow()},
  closeVow(){closePage('p-vow')},
  vowSet(_id,el){vowDays=parseInt(el.dataset.arg,10);drawVowPage()},
  vowPlus(){vowDays=clamp(vowDays+(vowDays>=100?10:vowDays>=30?5:1),1,999);drawVowPage()},
  vowMinus(){vowDays=clamp(vowDays-(vowDays>100?10:vowDays>30?5:1),1,999);drawVowPage()},
  vowSave(){
    const h=active();if(!h)return;
    if(isDaily(h)){
      if(vowDays<=streakDays(h))return toast('Этот срок уже пройден');
      h.vow={days:vowDays,startedAt:new Date().toISOString(),endsAt:null,status:'active'};
      save();closePage('p-vow');renderHome(true);
      return toast('Обет дан: '+nDays(vowDays)+' подряд');
    }
    const start=new Date(h.startedAt);
    const ends=new Date(start.getTime()+vowDays*D*1000);
    if(ends.getTime()<=Date.now())return toast('Этот срок уже прошёл');
    h.vow={days:vowDays,startedAt:h.startedAt,endsAt:ends.toISOString(),status:'active'};
    save();closePage('p-vow');renderHome(true);
    toast('Обет дан: '+nDays(vowDays));
  },
  vowEdit(){closeSheet();const h=active();vowDays=h&&h.vow?h.vow.days:30;setTimeout(drawVowPage,120)},
  vowCancel(){
    const h=active();if(!h||!h.vow)return;closeSheet();
    const vi=vowInfo(h);
    h.history.push({t:'vow_fail',at:new Date().toISOString(),days:h.vow.days,from:h.vow.startedAt,onDay:vi?vi.doneDays:0});
    h.vow=null;save();renderHome(true);toast('Обет снят');
  },
  celVowRepeat(id,el){
    const h=S.habits.find(x=>x.id===id);const d=parseInt(el.dataset.days,10);
    if(h&&isDaily(h)){
      h.vow={days:d,startedAt:new Date().toISOString(),endsAt:null,status:'active'};save();
      closeCelebration();renderHome(true);return toast('Новый обет: '+nDays(d)+' подряд');
    }
    if(h){
      // новый срок продолжает предыдущий с момента его окончания:
      // дни, прожитые между финишем и открытием приложения, честно засчитываются
      const from=new Date(el.dataset.at||Date.now());
      h.vow={days:d,startedAt:from.toISOString(),endsAt:new Date(from.getTime()+d*D*1000).toISOString(),status:'active'};
      save();
    }
    closeCelebration();renderHome(true);toast('Новый обет: '+nDays(d));
  },
  celVowNew(id){S.activeId=id;closeCelebration();renderHome(false);setTimeout(()=>{vowDays=30;drawVowPage()},400)},
  celClose(){closeCelebration();renderHome(false)},

  /* срыв и удаление */
  relapseAsk(){
    closeSheet();
    const h=active();if(!h)return;
    setTimeout(()=>sheet('Отсчёт начнётся заново. Серия и текущая аскеза уйдут в историю — это не поражение, это данные.',[
      {ico:'↩︎',label:'Да, записать срыв',act:'relapse',cls:'danger'},
    ]),140);
  },
  relapse(){
    const h=active();if(!h)return;closeSheet();
    const days=Math.floor(elapsed(h)/D);
    const now=new Date().toISOString();
    if(h.vow){
      const vi=vowInfo(h);
      h.history.push({t:'vow_fail',at:now,days:h.vow.days,from:h.vow.startedAt,onDay:vi?vi.doneDays:0});
      h.vow=null;
    }
    h.history.push({t:'relapse',at:now,streakDays:days});
    h.startedAt=now;
    h.sid=(h.sid||1)+1;                       // новая серия: прошлые вехи остаются в истории
    h.history.push({t:'start',at:now});
    save();renderHome(true);toast('Записано. Начинаем заново');
  },
  deleteAsk(){
    closeSheet();
    const h=active();if(!h)return;
    setTimeout(()=>sheet('«'+esc(h.name)+'» и вся её история будут удалены безвозвратно.',[
      {ico:'🗑',label:'Удалить навсегда',act:'del',cls:'danger'},
    ]),140);
  },
  del(){
    const h=active();if(!h)return;closeSheet();
    S.habits=S.habits.filter(x=>x.id!==h.id);
    S.activeId=S.habits.length?S.habits[0].id:null;
    save();renderHome(true);renderMenu();toast('Удалено');
  },

  /* страницы */
  chart(){openChart()},closeChart,
  phases(){openPhases()},closePhases(){closePage('p-phases')},
  history(){closeSheet();closePage('p-phases');openHistory()},closeHistory(){closePage('p-history')},
  data(){closeMenu();openData()},closeData(){closePage('p-data')},
  chRange(_id,el){
    chartRange=parseInt(el.dataset.arg,10);chartTouchDay=null;
    document.querySelectorAll('#p-chart .rb').forEach(b=>b.classList.toggle('on',+b.dataset.arg===chartRange));
    animateChart();
  },
  chInfo(){
    const b=$('ch-body'),a=$('ch-arrow');if(!b)return;
    const on=b.classList.toggle('on');
    if(a)a.style.transform=on?'rotate(90deg)':'';
  },
  phInfo(){
    const b=$('ph-body'),a=$('ph-arrow');if(!b)return;
    const on=b.classList.toggle('on');
    if(a)a.style.transform=on?'rotate(90deg)':'';
  },

  /* режим */
  wake(){const h=active();if(h&&isDaily(h))markDay(h,today(),localTime(new Date()))},
  backfill(_id,el){
    const h=active();if(!h||!isDaily(h))return;
    const[key,flag]=el.dataset.arg.split('|');
    markDay(h,key,null,flag==='1');
  },
  redoToday(){
    const h=active();if(!h||!isDaily(h))return;
    const m=checksOf(h)[today()];
    sheet('Сегодня'+(m&&m.at?' · отмечено в '+m.at:''),[
      {ico:'✓',label:'Встал вовремя',act:'setDay',arg:today()+'|1'},
      {ico:'✕',label:'Проспал',act:'setDay',arg:today()+'|0'},
      {ico:'🕐',label:'Указать точное время',act:'timeDay',arg:today()},
    ]);
  },
  setDay(_id,el){
    const h=active();if(!h||!isDaily(h))return;closeSheet();
    const[key,flag]=el.dataset.arg.split('|');
    setTimeout(()=>markDay(h,key,null,flag==='1'),170);
  },
  timeDay(_id,el){closeSheet();const k=el.dataset.arg;setTimeout(()=>openDayPage(k),170)},
  closeDay(){closePage('p-day')},
  saveDay(_id,el){
    const h=active();if(!h||!isDaily(h))return;
    const t=$('d-time');if(!t||!t.value)return toast('Укажи время');
    closePage('p-day');markDay(h,el.dataset.arg,t.value);
  },

  /* SOS */
  sos(){const h=active();if(h&&!isDaily(h))openSOS()},
  sosDone(){closeSOS(true)},
  sosClose(){closeSOS(false)},

  /* данные */
  exportData(){
    const json=exportJSON();
    const name='askeza-'+localDate(new Date())+'.json';
    const blob=new Blob([json],{type:'application/json'});
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Копия askeza'}).catch(()=>{});
      return;
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Файл сохранён');
  },
  async copyData(){
    const json=exportJSON();
    try{await navigator.clipboard.writeText(json);toast('Скопировано в буфер')}
    catch(e){
      const ta=$('imp-text');if(ta){ta.value=json;ta.select();toast('Скопируй текст из поля ниже')}
    }
  },
  importText(){
    const ta=$('imp-text');if(!ta||!ta.value.trim())return toast('Вставь текст копии');
    applyImport(ta.value);
  },
  importV1(){
    const n=importFromV1();
    closePage('p-data');
    renderHome(true);renderMenu();
    toast(n?('Перенесено: '+n+' '+plural(n,'привычка','привычки','привычек')):'Нечего переносить');
  },
  wipeAsk(){
    sheet('Все привычки, вехи и обеты будут удалены. Восстановить будет невозможно — если не сохранил копию.',[
      {ico:'🗑',label:'Удалить всё',act:'wipe',cls:'danger'},
    ]);
  },
  wipe(){
    closeSheet();S=blank();saveNow();
    closePage('p-data');renderHome(true);renderMenu();toast('Всё удалено');
  },
};

/* Делегирование: никаких inline-обработчиков и подстановки id в HTML. */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const fn=ACT[t.dataset.act];
  if(fn){e.stopPropagation();fn(t.dataset.id,t,e)}
});

/* Аппаратная и жестовая навигация «назад» */
history.replaceState({d:0},'');
window.addEventListener('popstate',()=>{
  if($('cel').classList.contains('on')){closeCelebration();pushDepth();return}
  if($('sos').classList.contains('on')){closeSOS(false);pushDepth();return}
  if($('sheet-bd').classList.contains('on')){closeSheet();pushDepth();return}
  if(openPages.length){closePage(openPages[openPages.length-1]);pushDepth();return}
  if(menuOpen){closeMenu();pushDepth();return}
});
function pushDepth(){history.pushState({d:1},'')}
pushDepth();

/* Пауза при сворачивании — не жечь батарею в фоне */
document.addEventListener('visibilitychange',()=>{
  running=!document.hidden;
  if(running){
    checkProgress();
    updateCraving(true);updateOdometer(true);
    const h=active();if(h)setGlow(phaseColorOf(h));
  }else saveNow();
});
window.addEventListener('pagehide',saveNow);
addEventListener('resize',()=>{
  if($('p-chart').classList.contains('on')){drawStatic(1)}
});

/* ------------------------------------------------------------
   Старт
   ------------------------------------------------------------ */
S=load();
// первый запуск: если есть данные из v1 — переносим сразу, старое не трогаем
if(!localStorage.getItem(KEY)&&!S.habits.length&&v1Available()){
  const n=importFromV1();
  if(n)setTimeout(()=>toast('Перенесено из askeza 1: '+n+' '+plural(n,'привычка','привычки','привычек')),700);
}
S.habits.forEach(h=>{if(!h.history.length)h.history.push({t:'start',at:h.startedAt})});
checkProgress();
renderHome(true);
renderMenu();
requestAnimationFrame(loop);
setTimeout(queueCelebrations,900);

if('serviceWorker'in navigator&&location.protocol!=='blob:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* Точка входа для автотестов */
window.__askeza={
  get S(){return S},
  plural,breakdown,localDate,craving,cravingDigits,zoneOf,phaseAt,buildCurve,CRAVING,CURVES,
  MILESTONES,vowInfo,elapsed,active,renderHome,checkProgress,guessKind,exportJSON,applyImport,
  esc,fmtLeft,fmtRough,nDays,KINDS,PHASE_SOURCE,
  isDaily,today,shiftDay,streakInfo,openDays,streakDays,bestStreak,calendarCells,dailyStats,
  markDay,wakeBy,checksOf,DAILY_MS,hasCurve,
  set(next){S=normalize(next);saveNow();renderHome(true);renderMenu()},
};
</script>
